                                   x-text="(lang==='zh' ? '… 还有 ' : '… ') + (searchHitsFor(m).length - 100) + (lang==='zh' ? ' 项匹配未显示' : ' more matches not shown')"></div>
                            </template>
                          </div>
                        </template>
                        <!-- MCP tool: smart render based on detected result shape.
                             - Array of objects → bullet list of compact JSON
                             - Object → pretty-printed JSON block
                             - Plain text → markdown-rendered card (a lot of
                               MCP servers return human prose, not data) -->
                        <template x-if="toolResultKind(m) === 'mcp'">
                          <div class="mcp-result-wrap">
                            <template x-if="mcpResultFormatted(m).kind === 'array'">
                              <ul class="mcp-result-list">
                                <template x-for="(item, idx) in mcpResultFormatted(m).value.slice(0, 50)" :key="idx">
                                  <li class="mcp-result-item">
                                    <span class="mcp-result-idx" x-text="'#' + (idx + 1)"></span>
                                    <pre class="mcp-result-item-body" x-text="typeof item === 'string' ? item : JSON.stringify(item, null, 2)"></pre>
                                  </li>
                                </template>
                                <template x-if="mcpResultFormatted(m).value.length > 50">
                                  <li class="mcp-result-truncated"
                                      x-text="(lang==='zh' ? '… 还有 ' : '… ') + (mcpResultFormatted(m).value.length - 50) + (lang==='zh' ? ' 条结果未显示' : ' more results not shown')"></li>
                                </template>
                              </ul>
                            </template>
                            <template x-if="mcpResultFormatted(m).kind === 'object'">
                              <pre class="mcp-result mcp-result-json" x-text="mcpResultFormatted(m).value"></pre>
                            </template>
                            <template x-if="mcpResultFormatted(m).kind === 'text'">
                              <div class="mcp-result-text" x-html="mdRender(mcpResultFormatted(m).value)"></div>
                            </template>
                          </div>
                        </template>
                        <!-- Fallback: plain text body -->
                        <template x-if="!toolResultKind(m)">
                          <pre x-text="toolResultBodyText(m)"></pre>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- system_note -->
              <template x-if="m.role === 'system_note'">
                <div class="sys-note" x-text="m.text"></div>
              </template>

              <!-- ask_user_question -->
              <template x-if="m.role === 'ask_user_question'">
                <div class="msg-row">
                  <span class="msg-avatar assistant-avatar"
                        :class="{ 'is-streaming-avatar': isStreamingTurnAvatar(i, paneMsgs, pane && pane.streaming) }"
                        :title="mascotLabel()">
                    <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
                  </span>
                  <div class="ask-question">
                    <div class="ask-header">
                      <span class="ask-title" x-text="t('ask.title')"></span>
                      <span x-show="m.submitted" class="ask-submitted-tag" x-text="t('ask.submitted')"></span>
                    </div>
                    <template x-for="(q, qIdx) in (m.questions || [])" :key="qIdx">
                      <div class="ask-question-block">
                        <div class="ask-question-head">
                          <span x-show="q.header" class="ask-question-chip" x-text="q.header"></span>
                          <span class="ask-question-text" x-text="q.question"></span>
                          <span x-show="q.multiSelect" class="ask-multi-tag" x-text="t('ask.multi')"></span>
                        </div>
                        <!-- Render normalized options. The label is computed
                             via askOptionLabel() instead of `opt.label` directly
                             so an old backend (pre-normalize) that forwarded
                             raw model output as `["a","b"]` / `[{text:"a"}]`
                             still produces clickable buttons. New backends
                             normalize this in ask_user_question.py — this is
                             belt+suspenders for "user is running new frontend
                             against old backend" scenarios. -->
                        <div class="ask-options">
                          <!-- role="button" instead of <button> tag because
                               the option may contain a markdown <div> preview;
                               <button><div></div></button> is invalid HTML5
                               (button only allows phrasing content) and some
                               browsers / touch contexts intermittently swallow
                               the click — symptom: card renders, click does
                               nothing, user "can't select" (reproduced
                               2026-05-21 / 2026-05-23). Div + role="button" +
                               keydown handlers preserve a11y while avoiding
                               the nesting trap. -->
                          <template x-for="(opt, optIdx) in (q.options || [])" :key="optIdx">
                            <div class="ask-option"
                                 role="button"
                                 :tabindex="m.submitted ? -1 : 0"
                                 :aria-disabled="m.submitted"
                                 :aria-pressed="isAskOptionPicked(m, qIdx, askOptionLabel(opt))"
                                 :class="{ picked: isAskOptionPicked(m, qIdx, askOptionLabel(opt)), disabled: m.submitted, 'has-preview': !!(opt && opt.preview) }"
                                 @click="m.submitted ? null : (q.multiSelect ? toggleAskOption(m, qIdx, askOptionLabel(opt)) : pickAskOption(m, qIdx, askOptionLabel(opt)))"
                                 @keydown.enter.prevent="m.submitted ? null : (q.multiSelect ? toggleAskOption(m, qIdx, askOptionLabel(opt)) : pickAskOption(m, qIdx, askOptionLabel(opt)))"
                                 @keydown.space.prevent="m.submitted ? null : (q.multiSelect ? toggleAskOption(m, qIdx, askOptionLabel(opt)) : pickAskOption(m, qIdx, askOptionLabel(opt)))">
                              <div class="ask-option-label" x-text="askOptionLabel(opt)"></div>
                              <div x-show="askOptionDesc(opt)" class="ask-option-desc" x-text="askOptionDesc(opt)"></div>
                              <!-- Optional preview (markdown / mockup / code).
                                   Model can attach rich context via the SDK's
                                   AskUserQuestion.options[].preview field; we
                                   render it as a collapsed footnote that opens
                                   in place when the option is focused / hovered. -->
                              <div x-show="opt && opt.preview"
                                   class="ask-option-preview"
                                   x-html="mdRender(opt && opt.preview || '')"></div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                    <div x-show="(m.questions || []).some(q => q.multiSelect) && !m.submitted && !m.askOtherOpen" class="ask-submit-row">
                      <button class="btn-primary" @click="submitAskAnswers(m)" x-text="t('ask.submit')"></button>
                    </div>
                    <!-- Free-text fallback. The MCP tool only lets the model
                         offer 2-4 fixed options; sometimes none fit and the
                         user wants to say something else. Claude Code's
                         AskUserQuestion has an implicit "Other" for the same
                         reason — without it the question is a forced choice
                         and the user has to either pick a wrong-ish option
                         or wait 10 min for the 600 s timeout to bail. Click
                         "其他" → inline textarea → submit routes the text
                         through /api/chat/answer the same way the buttons do,
                         so the model sees it as a normal tool result. -->
                    <div class="ask-other-section" x-show="!m.submitted">
                      <button x-show="!m.askOtherOpen"
                              class="ask-other-toggle"
                              @click="openAskOther(m)"
                              x-text="lang==='zh' ? '其他（自由输入）' : 'Other (custom answer)'"></button>
                      <div x-show="m.askOtherOpen" class="ask-other-form">
                        <textarea x-model="m.askOtherText"
                                  class="ask-other-textarea"
                                  rows="3"
                                  :placeholder="lang==='zh' ? '直接写你的回复…' : 'Type your reply…'"
                                  @keydown.escape.stop="cancelAskOther(m)"
                                  @keydown.meta.enter.prevent="submitAskOther(m)"
                                  @keydown.ctrl.enter.prevent="submitAskOther(m)"></textarea>
                        <div class="ask-other-actions">
                          <button class="ask-other-cancel" @click="cancelAskOther(m)"
                                  x-text="lang==='zh' ? '取消' : 'Cancel'"></button>
                          <button class="btn-primary" @click="submitAskOther(m)"
                                  :disabled="!(m.askOtherText || '').trim()"
                                  x-text="lang==='zh' ? '提交' : 'Submit'"></button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </template>

              <!-- ExitPlanMode permission_request — approval choices are mode
                   transitions, not a generic tool allow/always decision. -->
              <template x-if="m.role === 'permission_request' && isExitPlanPermission(m)">
                <div class="msg-row">
                  <span class="msg-avatar assistant-avatar"
                        :class="{ 'is-streaming-avatar': isStreamingTurnAvatar(i, paneMsgs, pane && pane.streaming) }"
                        :title="mascotLabel()">
                    <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
                  </span>
                  <div class="plan-card plan-approval-card"
                       :class="{
                         resolved: m.resolved,
                         submitting: m.submitting || m.awaitingTransition,
                         failed: m.decision === 'failed' || m.decision === 'expired',
                       }">
                    <div class="plan-head">
                      <span class="plan-icon"><svg><use href="#i-check-circle"/></svg></span>
                      <div class="plan-heading-copy">
                        <span class="plan-title"
                              x-text="m.title || m.display_name || t('plan.approval_title')"></span>
                        <span class="plan-display-name"
                              x-show="m.display_name && m.title"
                              x-text="m.display_name"></span>
                      </div>
                      <span class="plan-decision-tag"
                            x-show="m.resolved"
                            :class="m.decision === 'failed' || m.decision === 'expired'
                              ? 'is-failed'
                              : (m.decision === 'deny' ? 'is-denied' : 'is-approved')"
                            x-text="m.decision === 'failed' || m.decision === 'expired'
                              ? (m.decision === 'expired'
                                ? t('plan.approval_expired')
                                : t('plan.exit_failed'))
                              : (m.decision === 'deny'
                                ? t('plan.keep_planning_done')
                                : t('plan.approved_mode', {
                                  mode: permissionModeLabel(m.mode || m.return_mode),
                                }))"></span>
                    </div>
                    <div class="plan-description"
                         x-show="m.description || m.summary"
                         x-text="m.description || m.summary"></div>
                    <div class="plan-failure-detail"
                         x-show="m.decision === 'failed' && m.failure_message"
                         x-text="m.failure_message"></div>
                    <div class="plan-body markdown-body"
                         x-show="planPermissionMarkdown(m)"
                         x-html="renderMd(planPermissionMarkdown(m))"></div>
                    <div class="plan-return-mode"
                         x-show="m.return_mode && !m.resolved">
                      <span x-text="t('plan.return_mode')"></span>
                      <code x-text="permissionModeLabel(m.return_mode)"></code>
                    </div>
                    <div class="plan-approval-actions"
                         x-show="!m.resolved && !m.awaitingTransition">
                      <button class="btn-keep-planning"
                              :disabled="m.submitting"
                              @click="decidePermission(m, 'deny', null)"
                              x-text="t('plan.keep_planning')"></button>
                      <template x-for="suggestion in planModeSuggestions(m)"
                                :key="suggestion.mode">
                        <button class="btn-plan-approve"
                                :disabled="m.submitting"
                                @click="decidePermission(m, 'allow', suggestion.mode)"
                                x-text="planSuggestionLabel(suggestion.mode)"></button>
                      </template>
                    </div>
                    <div class="plan-approval-pending"
                         x-show="m.submitting || m.awaitingTransition"
                         x-text="m.awaitingTransition
                           ? t('plan.awaiting_transition')
                           : t('plan.submitting')"></div>
                  </div>
                </div>
              </template>

              <!-- Generic permission_request -->
              <template x-if="m.role === 'permission_request' && !isExitPlanPermission(m)">
                <div class="msg-row">
                  <span class="msg-avatar assistant-avatar"
                        :class="{ 'is-streaming-avatar': isStreamingTurnAvatar(i, paneMsgs, pane && pane.streaming) }"
                        :title="mascotLabel()">
                    <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
                  </span>
                  <div class="perm-request" :class="{ resolved: m.resolved }">
                    <!-- Compact tool card: tool name + decision tag on top
                         line (mirrors Read/Grep/Edit tool bubble layout),
                         summary below. The previous `.perm-header` row
                         (containing "Muse 想用一个工具" + a hero wrench
                         icon) was hero-treatment overkill — especially in
                         bypass mode where the card lands in the stream
                         already resolved and the user doesn't need a big
                         decision prompt. See plan
                         ~/.claude/plans/permission-claude-smooth-codd.md. -->
                    <div class="perm-body">
                      <div class="perm-tool">
                        <span class="perm-tool-name" x-text="m.tool"></span>
                        <span x-show="m.resolved" class="perm-decision-tag"
                              :class="'perm-decision-' + m.decision"
                              x-text="t('perm.decision_' + m.decision)"></span>
                      </div>
                      <pre class="perm-summary" x-text="m.summary"></pre>
                    </div>
                    <div class="perm-actions" x-show="!m.resolved">
                      <button class="btn-deny" :disabled="m.submitting"
                              @click="decidePermission(m, 'deny')" x-text="t('perm.deny')"></button>
                      <button class="btn-allow" :disabled="m.submitting"
                              @click="decidePermission(m, 'allow')" x-text="t('perm.allow')"></button>
                      <button class="btn-always" :disabled="m.submitting"
                              @click="decidePermission(m, 'always')" x-text="t('perm.always')"></button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Per-turn footer. A "turn" here = a contiguous run of
                   muse-side messages between two user messages. The
                   tail message of that run carries the footer; every
                   other message has it display:none. The footer hosts
                   BOTH the streaming dots (while in flight) and the
                   HH:MM completion stamp (once done) — so a multi-
                   block turn (thinking + tool_use + assistant + …)
                   shows ONE indicator at the bottom of the whole run,
                   not one per block.

                   Uses x-show (not <template x-if>) intentionally:
                   nesting x-if inside x-for had reactivity glitches
                   where isTurnTail() wasn't re-evaluated on push to
                   the messages array, leaving previous turn-tails
                   stuck "showing" or new ones never appearing. x-show
                   keeps the DOM node always present and only toggles
                   display, which Alpine handles reliably per-frame. -->
              <!-- Inline expression instead of method call so Alpine
                   tracks reactive deps (m.role / messages[i+1].role /
                   messages.length) directly — method calls aren't
                   guaranteed to wire up reactivity inside x-for. -->
              <!-- Doubles as the TURN SEPARATOR. A session is otherwise one
                   seamless stream of near-identical cards with no mark for
                   "a turn ended here" — scrolling 300 messages on a phone,
                   there is nothing to orient against. This row already sat at
                   exactly the right place (the tail of every turn) and already
                   carried the one fact worth anchoring to (the time), so it
                   becomes the boundary rather than adding a second element.
                   It is also the single source of live turn status: restrained
                   dots appear beside "Running" here, avoiding a duplicate
                   sticky status row at the bottom of the viewport. -->
              <div class="turn-footer"
                   x-show="(m.role !== 'user' || m.turn_status || m._interrupted || m._failed)
                     && (i === paneMsgs.length - 1
                       || (paneMsgs[i + 1] && (
                         paneMsgs[i + 1].role === 'user'
                         || paneMsgs[i + 1].display_kind === 'runtime_continuation'
                       )))
                     && turnFooterStatus(m, pane)
                     && (
                       turnFooterTime(m, pane)
                       || turnFooterElapsed(m, pane) !== null
                       || turnFooterModel(m, pane, tid)
                       || turnFooterStatus(m, pane)
                       || m._interrupted
                       || (turnForkMessageId(paneMsgs, i) && !(pane && pane.streaming))
                     )">
                <span class="turn-status"
                      x-show="turnFooterStatus(m, pane)"
                      :class="[turnFooterStatus(m, pane), {
                        'background-pending': turnHasPendingBackground(
                          m, pane, i === paneMsgs.length - 1)
                      }]">
                  <span class="turn-running-dots"
                        x-show="turnFooterStatus(m, pane) === 'running'"
                        aria-hidden="true"><span></span><span></span><span></span></span>
                  <span x-text="turnHasPendingBackground(
                                  m, pane, i === paneMsgs.length - 1)
                                ? t('chat.main_response_completed')
                                : turnStatusLabel(turnFooterStatus(m, pane))"></span>
                  <span class="turn-background-running"
                        x-show="turnHasPendingBackground(
                          m, pane, i === paneMsgs.length - 1)"
                        x-text="' · ' + t('chat.background_running_count', {
                          count: _backgroundTaskCount(pane),
                          n: _backgroundTaskCount(pane)
                        })"></span>
                </span>
                <!-- Old transcripts may predate completion annotations.  Their
                     last record still carries mts, which is a close and stable
                     fallback instead of rendering a separator with no time. -->
                <span x-show="turnFooterTime(m, pane)"
                      class="msg-ts"
                      x-text="fmtTurnTime(turnFooterTime(m, pane))"></span>
                <!-- Total elapsed kept after done so the user can
                     reference back how long the turn took (esp. useful
                     for long agentic runs). Stamped in _markDone next
                     to .ts; only shown when both exist and m.elapsed
                     >= 1s (sub-second replies don't need the noise). -->
                <span x-show="turnFooterElapsed(m, pane) !== null && turnFooterTime(m, pane)"
                      class="msg-elapsed"
                      x-text="'· ' + fmtStreamElapsed(turnFooterElapsed(m, pane))"></span>
                <span x-show="turnFooterModel(m, pane, tid)" class="turn-model"
                      :title="turnFooterModel(m, pane, tid)"
                      x-text="'· ' + modelLabel(turnFooterModel(m, pane, tid))"></span>
                <button type="button" class="memory-recall-trace"
                        x-show="m.memoryRecall && m.memoryRecall.count"
                        :aria-expanded="memoryRecallPopover.show && _memoryRecallOwner === m"
                        @click.stop="toggleMemoryRecallPopover($event, m)"
                        x-text="lang==='zh'
                          ? `· 使用了 ${m.memoryRecall?.count || 0} 条记忆`
                          : `· Used ${m.memoryRecall?.count || 0} memories`"></button>
                <button class="turn-fork-btn"
                        type="button"
                        x-show="turnForkMessageId(paneMsgs, i) && !(pane && pane.streaming)"
                        :disabled="forkingSessionId === tid || isTabStreaming(tid)"
                        @click.stop="forkConversation(tid, turnForkMessageId(paneMsgs, i))"
                        :title="lang==='zh' ? '从这里 Fork' : 'Fork from here'"
                        :aria-label="lang==='zh' ? '从这里 Fork' : 'Fork from here'">
                  <svg><use href="#i-fork"/></svg>
                </button>
              </div>
            </div>
          </template>
          </div>
          </template>
          <!-- /P1 per-tab message panes. Siblings below (pre-response status,
               pending queue, banners) stay single-instance with active-tab
               semantics through the activeSession façade above. -->
          <!-- Before the first muse-side block exists there is no message tail
               on which to mount the normal turn footer. Render the SAME footer
               contract here temporarily instead of reviving a second avatar +
               "Muse is thinking" bubble. It disappears as soon as any muse-side
               block arrives, whereupon that block's own footer takes over. -->
          <!-- Auto-compact has its distinct 📦 placeholder and wins this slot.
               A continuation waiting for background settlement is deliberately
               quiet until its reaction stream actually starts. -->
          <div x-show="activeSession.streaming && (!activeSession.messages.length
                                       || activeSession.messages[activeSession.messages.length-1].role === 'user')
                       && !activeSession.compacting
                       && !activeSession._continuationAwaitingReaction"
               class="turn-footer turn-pending-footer"
               x-cloak>
            <span class="turn-status running">
              <span class="turn-running-dots" aria-hidden="true"><span></span><span></span><span></span></span>
              <span x-text="turnStatusLabel('running')"></span>
            </span>
            <span x-show="activeSession._streamStartedAt"
                  class="msg-ts"
                  x-text="fmtTurnTime(activeSession._streamStartedAt)"></span>
            <span x-show="activeSession.streamElapsed >= 1"
                  class="msg-elapsed"
                  x-text="'· ' + fmtStreamElapsed(activeSession.streamElapsed)"></span>
            <span x-show="activeSession.streamingModel"
                  class="turn-model"
                  :title="activeSession.streamingModel"
                  x-text="'· ' + modelLabel(activeSession.streamingModel)"></span>
          </div>

          <!-- Standalone streaming rows are retired. Before the first response
               block the temporary separator above owns status; afterwards the
               per-turn footer inside the message loop owns it. -->

          <!-- Pending queue: messages the user sent while Muse was still
               replying (or while a compact was running). They auto-drain on
               the next done event / compact-finally / activateTab. Faded
               + dashed border distinguishes them from real user bubbles. -->
          <template x-for="(q, qi) in activeSession.pendingQueue" :key="q.id">
            <div class="msg user queued">
              <div class="msg-row queued-row">
                <div class="bubble user-bubble queued-bubble">
                  <div class="queued-header">
                    <span class="queued-icon"><svg><use href="#i-clock"/></svg></span>
                    <span class="queued-label"
                          x-text="(lang==='zh' ? '已排队 ' : 'Queued ') + (qi+1) + ' / '
                                   + activeSession.pendingQueue.length"></span>
                    <!-- "已排队 1/2" alone reads as "will send shortly", which
                         is wrong while the queue is paused — the item will
                         NEVER send until Resume. State the difference on the
                         bubble, not just in the banner: the banner sits at the
                         bottom of the chat and is easy to scroll past on a
                         phone, and the bubble is what the user actually looks
                         at when wondering why nothing happened. -->
                    <span class="queued-paused-badge"
                          x-show="activeSession._queuePaused"
                          x-text="lang==='zh' ? '已暂停' : 'paused'"></span>
                    <span style="flex:1"></span>
                    <button class="queued-act icon-btn sm"
                            @click="editPendingQueueItem(currentId, qi)"
                            :disabled="queueActionBusy(currentId, 'edit:' + q.id)"
                            :title="lang==='zh' ? '编辑' : 'Edit'">
                      <svg><use href="#i-edit"/></svg>
                    </button>
                    <button class="queued-act icon-btn sm"
                            @click="removePendingQueueItem(currentId, qi)"
                            :disabled="queueActionBusy(currentId, 'remove:' + q.id)"
                            :title="lang==='zh' ? '移除' : 'Remove'">
                      <svg><use href="#i-x"/></svg>
                    </button>
                  </div>
                  <div class="queued-quote-list" x-show="q.pendingQuotes && q.pendingQuotes.length">
                    <template x-for="(quote, qidx) in (q.pendingQuotes || [])"
                              :key="quote.id || ('queued-quote-'+qidx)">
                      <div class="queued-quote-chip" :title="previewQuoteExcerpt(quote)">
                        <svg aria-hidden="true"><use :href="previewQuoteSourceIcon(quote)"/></svg>
                        <span x-text="previewQuoteSourceName(quote) + ' · ' + previewQuoteExcerpt(quote)"></span>
                      </div>
                    </template>
                  </div>
                  <div class="queued-text" x-show="q.displayText" x-text="q.displayText"></div>
                  <!-- FIX ③: the server resolves queued upload IDs against its
                       in-memory store, so we can render real image thumbnails
                       and named doc chips here — matching how a SENT message
                       looks, instead of the old neutral "含附件" marker.
                       Expired uploads (TTL) show a muted "附件已过期" chip. -->
                  <div class="queued-attach" x-show="q.hasAttach">
                    <template x-for="(im, ii) in (q.images || [])" :key="'qimg'+ii">
                      <img class="queued-thumb" x-show="im.src"
                           :src="im.src || null" loading="lazy" alt=""
                           @error="$el.style.display='none'" />
                    </template>
                    <template x-for="(d, di) in (q.docs || [])" :key="'qdoc'+di">
                      <span class="queued-doc-chip" :title="d.name + ' · ' + d.kind">
                        <svg><use href="#i-file-text"/></svg>
                        <span x-text="d.name"></span>
                      </span>
                    </template>
                    <span class="queued-doc-chip queued-attach-expired"
                          x-show="q.expiredCount > 0">
                      <svg><use href="#i-alert-triangle"/></svg>
                      <span x-text="lang==='zh' ? '附件已过期' : 'attachment expired'"></span>
                    </span>
                    <!-- Fallback: ids present but metadata not yet resolved
                         (e.g. mid tab-switch before the queue sync lands). -->
                    <span class="queued-doc-chip"
                          x-show="!(q.images && q.images.length) && !(q.docs && q.docs.length) && !q.expiredCount">
                      <svg><use href="#i-paperclip"/></svg>
                      <span x-text="lang==='zh' ? '含附件' : 'has attachment'"></span>
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <!-- Idle-with-items banner. Shows whenever the queue has items but
               nothing is running on this session (not streaming, not
               compacting, not mid-reattach). Two reasons this happens:
                 1. An error / interrupt paused the queue server-side
                    (_queuePaused) — the user fixes the root cause then resumes.
                 2. Items left dormant after a process restart — the server
                    intentionally does NOT auto-resume draining on boot, so
                    they wait here for an explicit Resume.
               While a turn is running, items normally auto-drain server-side
               and this banner stays hidden — EXCEPT when the queue is paused.
               The old `!streaming` gate assumed running ⇒ will drain, which is
               exactly false in the paused state: the user starts a new turn,
               sees no banner, the turn ends, dequeue_message returns None
               because of the flag, and nothing ever indicates why. Paused wins
               over streaming (2026-07-25 report: 2 items sat through several
               completed turns with no visible cause). -->
          <div x-show="activeSession.pendingQueue.length
                        && (!activeSession.streaming || activeSession._queuePaused)
                        && !activeSession.backgroundActive
                        && !activeSession.compacting
                        && !activeSession._draining"
               class="queue-paused-banner">
            <span class="queue-paused-icon"><svg><use href="#i-alert-triangle"/></svg></span>
            <span class="queue-paused-text"
                  x-text="(activeSession._queuePaused
                            ? (lang==='zh' ? '上一条中断，队列已暂停（' : 'Queue paused (')
                            : (lang==='zh' ? '队列等待中（' : 'Queue waiting (' ))
                          + activeSession.pendingQueue.length
                          + (lang==='zh' ? ' 条）' : ' waiting)')"></span>
            <button class="queue-paused-btn primary"
                    @click="resumeQueueDrain(currentId)"
                    :disabled="queueActionBusy(currentId, 'resume')"
                    x-text="lang==='zh' ? '继续执行' : 'Resume'"></button>
            <button class="queue-paused-btn"
                    @click="discardQueue(currentId)"
                    :disabled="queueActionBusy(currentId, 'discard')"
                    x-text="lang==='zh' ? '清空队列' : 'Discard'"></button>
          </div>

          <!-- Compact-in-progress keeps its distinct 📦 placeholder because it
               describes conversation maintenance rather than a response turn.
               Appears for the full window between native-compact POST and
               loadSession completing — can be ~20-60s on a long session. -->
          <div x-show="activeSession.compacting" class="msg assistant compact-pending">
            <div class="msg-row">
              <span class="msg-avatar assistant-avatar is-streaming-avatar" :title="mascotLabel()">
                <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
              </span>
              <div class="bubble pending">
                <span class="compact-pending-icon"><svg><use href="#i-package"/></svg></span>
                <span class="thinking-dots"><span></span><span></span><span></span></span>
                <span class="thinking-label" x-text="compactPendingLabel()"></span>
              </div>
            </div>
          </div>
          <!-- One stable physical target for every tail-follow path. Message
               virtualization may replace the mounted rows and spacers, but this
               node never changes identity or disappears at stream completion. -->
          <div x-ref="chatBottom" class="chat-bottom-anchor" aria-hidden="true"></div>
        </div>
        <button class="jump-bottom" x-show="!activeSession.atBottom" @click="scrollToBottom(true)" :title="lang==='zh'?'最新':'Jump to latest'" :aria-label="lang==='zh' ? '跳到最新消息' : 'Jump to latest'"><svg><use href="#i-arrow-down"/></svg></button>
        <!-- Outline FAB — sits right above jump-bottom in the same chat
             pane. Same visibility rule as jump-bottom (x-show="!activeSession.atBottom")
             so the two appear/disappear together as a pair. -->
        <button class="chat-outline-fab" x-show="!activeSession.atBottom"
                @click="openMessageOutline($event)"
                :title="lang==='zh' ? '会话目录' : 'Outline'"
                :aria-label="lang==='zh' ? '打开会话目录' : 'Open conversation outline'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <circle cx="4" cy="6" r="1" fill="currentColor"/>
            <circle cx="4" cy="12" r="1" fill="currentColor"/>
            <circle cx="4" cy="18" r="1" fill="currentColor"/>
          </svg>
        </button>
        <!-- Prev-user FAB — top of the chat-pane stack, sits 46px above
             the outline FAB. Steps the viewport up to the previous user
             message so you can walk back through your own turns. Shares
             the trio's x-show="!activeSession.atBottom" visibility. -->
        <button class="chat-prevuser-fab" x-show="!activeSession.atBottom" @click="jumpToPrevUser()"
                :title="lang==='zh' ? '上一条提问' : 'Previous message'"
                :aria-label="lang==='zh' ? '跳到上一条用户消息' : 'Jump to previous user message'"><svg><use href="#i-arrow-up"/></svg></button>
        </div>
      </div>

      <div class="chat-input">
        <!-- Composer settings panel (mobile gear). Anchored HERE, not next to
             its button: the button lives in .chat-toolbar inside
             .chat-input-wrap, which sets `overflow: hidden` to clip the
             textarea + toolbar to the rounded frame. A panel popping upward
             from inside that box gets cut at the wrap's top edge — with the
             41-char zh effort label wrapping to 3 lines the panel was ~176px
             tall against ~46px of usable room, so all the user ever saw was
             the bottom slice (one bare select). z-index could not help: this
             is clipping, not stacking. Same escape hatch .mention-pop already
             uses — .chat-input is position:relative with no overflow rule. -->
        <div class="chat-toolbar-more-pop"
             x-show="composerSettingsOpen"
             x-cloak
             @click.outside="composerSettingsOpen = false">
          <label class="chat-toolbar-more-field">
            <span x-text="t('set.label.default_permission')"></span>
            <select x-model="permission" @change="onPermissionChange()"
                    :disabled="permissionControlDisabled()"
                    :aria-busy="tabState[currentId]?._permissionChangePending"
                    :title="permissionControlTitle()">
              <option value="bypassPermissions">bypass</option>
              <option value="acceptEdits">acceptEdits</option>
              <option value="default">default</option>
              <option value="dontAsk">dontAsk</option>
              <option value="auto">auto</option>
              <option value="plan">plan</option>
            </select>
          </label>
          <!-- `effort.label`, not `effort.title`: the latter is tooltip prose
               ("Effort — Anthropic 官方术语，控制推理预算与…") and was being
               rendered as a visible field label. -->
          <label class="chat-toolbar-more-field" x-show="_showEffortControl(model)">
            <span x-text="t('effort.label')" :title="t('effort.title')"></span>
            <select x-model="effort" @change="onEffortChange()"
                    :disabled="workspaceSwitching"
                    :aria-busy="runtimeSettingsPending()">
              <!-- effortOptLabel, not t(): the raw labels carry an "Effort · "
                   prefix for the unlabelled desktop select, which under this
                   field's own "Effort" label printed the word twice. -->
              <template x-for="opt in effortChoices(model)" :key="opt.value || 'auto'">
                <option :value="opt.value" x-text="effortOptLabel(opt)"></option>
              </template>
            </select>
          </label>
          <label class="chat-toolbar-more-field row" x-show="_showFastControl(model)"
                 :title="t('service_tier.title')">
            <span x-text="t('service_tier.label')"></span>
            <span class="switch sm">
              <input type="checkbox" :checked="serviceTier === 'fast'"
                     :disabled="workspaceSwitching"
                     @change="onServiceTierChange($event.target.checked)"
                     :aria-busy="runtimeSettingsPending()">
              <span class="switch-slider"></span>
            </span>
          </label>
          <!-- Concise mode. A device preference, not a session one — it sits
               here rather than in Settings because the screen it fixes is the
               one you're holding, and this panel is already the "how does this
               chat behave" drawer within thumb reach. -->
          <label class="chat-toolbar-more-field row">
            <span x-text="t('concise.label')" :title="t('concise.title')"></span>
            <span class="switch sm">
              <input type="checkbox" :checked="conciseChat"
                     @change="toggleConciseChat()">
              <span class="switch-slider"></span>
            </span>
          </label>
        </div>
        <!-- / slash command palette -->
        <div class="mention-pop slash-pop" x-show="SLASH_ENABLED && slashShow" x-transition.opacity
             @click.outside="slashShow=false">
          <div class="mention-hint"
               x-text="slashStage === 'argument' ? t('slash.arg_hint') : t('slash.hint')"></div>
          <template x-for="(c, i) in slashResults" :key="c._key">
            <div :class="'mention-item ' + (slashIdx===i?'sel':'')"
                 @mousedown.prevent="pickSlash(i)" @mouseenter="slashIdx=i">
              <span class="slash-name mono"
                    x-text="c._kind === 'argument' ? c.label : '/' + (c._displayName || c.name)"></span>
              <span class="slash-current" x-show="c.current" x-text="t('slash.current')"></span>
              <span class="slash-desc"
                    x-text="c._kind === 'argument'
                      ? ([c.value !== c.label ? c.value : '', c.hint].filter(Boolean).join(' · '))
                      : (c.desc[lang] || c.desc.zh)"></span>
            </div>
          </template>
          <div class="hint-row" x-show="!slashResults.length"
               x-text="slashStage === 'argument' ? t('slash.no_arg') : t('slash.none')"></div>
        </div>
        <!-- @ mention -->
        <div class="mention-pop" x-show="mentionShow" x-transition.opacity>
          <div class="mention-hint" x-html="lang==='zh' ? '<span class=&quot;kbd&quot;>↑↓</span> 选 · <span class=&quot;kbd&quot;>Enter</span> 插入 · <span class=&quot;kbd&quot;>Esc</span> 关' : '<span class=&quot;kbd&quot;>↑↓</span> nav · <span class=&quot;kbd&quot;>Enter</span> insert · <span class=&quot;kbd&quot;>Esc</span> close'"></div>
          <template x-for="(f, i) in mentionResults" :key="f.path">
            <div :class="'mention-item ' + (mentionIdx===i?'sel':'') + (f._open?' is-open':'')"
                 :title="f.path"
                 @mousedown.prevent="pickMention(i)" @mouseenter="mentionIdx=i">
              <span class="icon"><svg><use :href="iconRef(f)"/></svg></span>
              <div class="body">
                <div class="name-row">
                  <span class="name ellipsis" x-text="f.name"></span>
                  <span x-show="f._open" class="mention-open-badge"
                        x-text="lang==='zh' ? '已打开' : 'open'"></span>
                </div>
                <div class="path-hint ellipsis" x-text="f.path"></div>
              </div>
            </div>
          </template>
          <div class="hint-row" x-show="!mentionResults.length" x-text="t('files.empty_search')"></div>
        </div>
        <!-- Attachment preview row (above input). -->
        <!-- Pending attachment chips. Upload starts eagerly the moment the
             file is picked / pasted / dropped — by the time the user finishes
             typing it's almost always done. We deliberately DON'T render an
             "uploading…" spinner: the spinner used to make the chip feel like
             a separate uploading step before send, when in fact send-time
             auto-wait (sendMessage) already handles the rare case where the
             upload is still in flight. Only the .error state gets a visual —
             a red border via .img-chip.error / .doc-chip.error in styles.css. -->
        <div class="img-attachments"
             x-show="pendingQuotes.length || pendingImages.length || pendingDocs.length">
          <template x-for="(quote, i) in pendingQuotes"
                    :key="quote.id || ('q'+i)">
            <div class="selection-quote-chip" :title="previewQuoteExcerpt(quote)">
              <span class="selection-quote-icon">
                <svg aria-hidden="true"><use :href="previewQuoteSourceIcon(quote)"/></svg>
              </span>
              <div class="selection-quote-body">
                <div class="selection-quote-source" x-text="previewQuoteSourceName(quote)"></div>
                <div class="selection-quote-text" x-text="previewQuoteExcerpt(quote)"></div>
              </div>
              <button type="button" class="selection-quote-x icon-btn sm"
                      @click="removePendingQuote(i)"
                      :title="lang==='zh' ? '移除引用' : 'Remove quote'">
                <svg><use href="#i-x"/></svg>
              </button>
            </div>
          </template>
          <template x-for="(img, i) in pendingImages" :key="img.id || ('i'+i)">
            <div class="img-chip" :class="{ uploading: img.uploading, error: img.error }">
              <!-- empty :src would resolve to page URL and fail (see queued-img guard) -->
              <img :src="img.preview || 'data:image/gif;base64,R0lGODlhAQABAAAAACw='"
                   alt="" :style="img.preview ? '' : 'opacity:0.3'" />
              <!-- "Annotate" button — opens the image editor over this image.
                   Disabled while the chip is still uploading so we don't lose
                   the user's edits if the upload errors out mid-edit. -->
              <button class="img-chip-edit icon-btn sm"
                      @click="openImageEditor(i)"
                      :disabled="img.uploading || !img.file"
                      :title="lang==='zh' ? '画笔编辑' : 'Annotate'">
                <svg><use href="#i-pen"/></svg>
              </button>
              <button class="img-chip-x icon-btn sm"
                      @click="removePendingImage(i)" :title="t('img.remove')">
                <svg><use href="#i-x"/></svg>
              </button>
              <!-- Slim animated progress bar at the chip's bottom edge.
                   Replaces the previous big spinning overlay (user wanted
                   the chip to feel "uploaded" instantly); a hairline gives
                   the necessary feedback on slow / large uploads without
                   reading as a separate processing step. Disappears the
                   moment upload completes or errors out. -->
              <div x-show="img.uploading" class="chip-upload-bar"></div>
            </div>
          </template>
          <template x-for="(doc, i) in pendingDocs" :key="doc.id || ('d'+i)">
            <div class="doc-chip" :class="{ uploading: doc.uploading, error: doc.error }"
                 :title="doc.name + ' · ' + doc.kind">
              <span class="doc-chip-icon"><svg><use href="#i-file-text"/></svg></span>
              <div class="doc-chip-body">
                <div class="doc-chip-name" x-text="doc.name"></div>
                <div class="doc-chip-kind" x-text="doc.kind"></div>
              </div>
              <button class="doc-chip-x icon-btn sm"
                      @click="removePendingDoc(i)" :title="t('img.remove')">
                <svg><use href="#i-x"/></svg>
              </button>
              <div x-show="doc.uploading" class="chip-upload-bar"></div>
            </div>
          </template>
        </div>
        <!-- VSCode-Claude–style layout:
             row 1: textarea (full width, no neighbors)
             row 2: bottom toolbar with all controls — attach / model /
                    permission / thinking / ctx chip / send -->
        <div class="chat-input-wrap"
             @dragover.prevent="dragHover=true"
             @dragleave="dragHover=false"
             @drop.prevent="dragHover=false; onAttachDrop($event)"
             :class="{ 'drag-hover': dragHover }">
          <!-- No `accept` filter — lets the user pick any file from the OS
               picker. The classifier (frontend + backend) decides what
               actually gets inlined; unsupported types are rejected with
               a clear toast instead of being hidden in the picker. -->
          <input type="file" x-ref="attachInput"
                 multiple style="display:none"
                 @change="onAttachPicked($event)" />
          <!-- No-provider gate banner: when no model is configured the
               composer below is disabled (every send would 401 + lock the
               session to an unreachable model). Point the user at Settings
               so a provider is configured before any turn can fire. -->
          <!-- Two distinct empty states, same `!availableModels.length` gate:
               · has_any_provider=false → genuinely nothing configured.
               · has_any_provider=true  → a provider IS configured (e.g. a
                 third-party key) but no model is ready yet — credentials
                 incomplete or still validating. The old single copy ("配置一个
                 provider") misled users who *had* configured one (2026-06-06).
               No "switch model" CTA here: availableModels is empty, so there's
               nothing to switch to — the fix is to check credentials. -->
          <!-- Gated on _modelsLoaded: an empty availableModels is also its
               value before /api/chat/providers has answered, so this used to
               flash on every page load and tell an already-configured user to
               go configure a provider. -->
          <div class="chat-input-noprov"
               x-show="_modelsLoaded && !availableModels.length" x-cloak>
            <span x-text="(contextInfo && contextInfo.has_any_provider)
                            ? (lang==='zh'
                                ? '已配置 provider，但当前没有可用模型 —— 凭证可能未填全或仍在校验，打开设置检查一下'
                                : 'A provider is configured, but no model is ready yet — credentials may be incomplete or still validating. Open Settings to check.')
                            : (lang==='zh'
                                ? '还没有可用模型 —— 先配置一个 provider 才能开始对话'
                                : 'No model available — configure a provider to start chatting')"></span>
            <button class="btn-primary" @click="openSettings()"
                    x-text="lang==='zh' ? '打开设置' : 'Open Settings'"></button>
          </div>
          <!-- 包一个 noop form：iOS 17+ AutoFill 会用"页面上下文"决定要不要在
               键盘上方塞快译条；只要 textarea 没有 form 父元素 / form 里有
               type=password input，iOS 就会把它当成账户字段。display:contents
               让这个 form 不参与布局，只提供 DOM 语义。 -->
          <form autocomplete="off" onsubmit="return false" style="display:contents">
          <textarea x-ref="chatInput"
                    x-effect="_syncChatInputDom(input, { target: $el })"
                    rows="1"
                    :disabled="!availableModels.length"
                    class="chat-input-textarea"
                    name="muselab-chat-message"
                    inputmode="text"
                    autocomplete="off" autocorrect="off"
                    autocapitalize="sentences" spellcheck="false"
                    enterkeyhint="enter"
                    data-1p-ignore="" data-lpignore="true" data-form-type="other"
                    @keydown.enter="onEnter($event)"
                    @keydown.tab="onSlashTab($event)"
                    @keydown="onImeKeydown($event)"
                    @keyup.enter="onImeEnterKeyup($event)"
                    @keydown.escape="mentionShow=false; slashShow=false"
                    @keydown.ctrl.x="onCutLine($event)"
                    @keydown.meta.x="onCutLine($event)"
                    @keydown.up="onChatArrowUp($event)"
                    @keydown.down="onChatArrowDown($event)"
                    @compositionstart="onImeCompositionStart($event)"
                    @compositionend="onImeCompositionEnd($event)"
                    @beforeinput="onChatBeforeInput($event)"
                    @input="onChatInput($event); autoGrow($event.target)"
                    @paste="onImagePaste($event)"
                    @focus="onChatInputFocus($event)"
                    @blur="onChatInputBlur($event)"
                    @click="onChatInputClick($event)"
                    :placeholder="t('chat.placeholder')"></textarea>
          </form>
          <div class="chat-toolbar"
               :class="{ 'has-stop': isTabStreaming(currentId) }">
            <!-- Attach button — enabled while streaming too, so attachments
                 can be added to a queued message (upload is independent of
                 the running turn). -->
            <button @click="$refs.attachInput.click()"
                    class="chat-toolbar-btn"
                    :title="t('attach.title')">
              <svg><use href="#i-paperclip"/></svg>
            </button>
            <!-- Command-palette opener lives in the chat pane's TOP bar
                 (global "files / sessions / actions" entry), not here.
                 This bottom toolbar is reserved for per-turn controls
                 (attach / model / permission / effort / context ring).
                 The header button shows on touch too, so mobile still
                 reaches the palette. (2026-05-29: removed the duplicate
                 mobile-only magnifier that doubled the header one.) -->
            <!-- Skills / MCP drawer toggles moved to the top bar (2026-05-29).
                 See the header near the organize / scheduler buttons. -->
            <!-- Model selector -->
            <select x-model="model" @change="onModelChange()"
                    class="chat-toolbar-select"
                    :disabled="workspaceSwitching"
                    :title="lang==='zh' ? '切换模型' : 'Switch model'">
              <template x-if="model && !availableModels.some(m => m.model === model)">
                <option :value="model" x-text="model"></option>
              </template>
              <template x-for="grp in modelGroups()" :key="grp.name">
                <optgroup :label="grp.name">
                  <template x-for="m in grp.items" :key="m.model">
                    <option :value="m.model" x-text="m.label"></option>
                  </template>
                </optgroup>
              </template>
            </select>
            <!-- Permission mode -->
            <select x-model="permission" @change="onPermissionChange()"
                    class="chat-toolbar-select chat-toolbar-permission"
                    :disabled="permissionControlDisabled()"
                    :aria-busy="tabState[currentId]?._permissionChangePending"
                    :title="permissionControlTitle()">
              <option value="bypassPermissions">bypass</option>
              <option value="acceptEdits">acceptEdits</option>
              <option value="default">default</option>
              <option value="dontAsk">dontAsk</option>
              <option value="auto">auto</option>
              <option value="plan">plan</option>
            </select>
            <!-- Reasoning effort. Options come from this model's exact
                 /api/chat/providers effort_levels capability list. This keeps
                 Codex Sol's xhigh/max/ultra visible without implying that every
                 model supports them. `auto` delegates to the runtime. -->
            <select x-model="effort" @change="onEffortChange()"
                    x-show="_showEffortControl(model)"
                    class="chat-toolbar-select chat-toolbar-effort"
                    :disabled="workspaceSwitching"
                    :aria-busy="runtimeSettingsPending()"
                    :title="t('effort.title')">
              <template x-for="opt in effortChoices(model)" :key="opt.value">
                <option :value="opt.value" x-text="t(opt.labelKey)"></option>
              </template>
            </select>
            <!-- Fast is a provider service tier, independent from reasoning
                 effort. It appears only when the selected model advertises
                 supports_fast and is persisted per session. -->
            <button type="button"
                    class="chat-toolbar-fast"
                    :class="{ active: serviceTier === 'fast' }"
                    x-show="_showFastControl(model)"
                    :disabled="workspaceSwitching"
                    :aria-pressed="serviceTier === 'fast'"
                    :aria-busy="runtimeSettingsPending()"
                    @click="onServiceTierChange(serviceTier !== 'fast')"
                    :title="t('service_tier.title')"
                    x-text="t('service_tier.label')"></button>
            <!-- Mobile-only gear: on phones the permission + effort selects
                 above are hidden (CSS) and collapsed in here, so the composer
                 toolbar stays a single row instead of wrapping to two. Desktop
                 hides this whole group and keeps the selects inline. The selects
                 inside share the SAME x-model as the inline ones, so flipping
                 either keeps both in sync — no extra state to reconcile. -->
            <div class="chat-toolbar-more">
              <button type="button"
                      class="chat-toolbar-btn chat-toolbar-more-btn"
                      :class="{ active: composerSettingsOpen }"
                      @click.stop="composerSettingsOpen = !composerSettingsOpen"
                      :title="lang==='zh' ? '会话设置（权限 / Effort / Fast）' : 'Session settings (permission / effort / Fast)'">
                <svg><use href="#i-sliders"/></svg>
              </button>
              <!-- The panel itself is NOT here — see .chat-toolbar-more-pop
                   further up, hoisted out to .chat-input. It has to live
                   outside .chat-input-wrap, which is `overflow: hidden` and
                   was slicing the panel down to its bottom ~46px. Only
                   `composerSettingsOpen` ties the two together, so the split
                   costs nothing. -->
            </div>
            <!-- Extended-thinking on/off. Default on. Turning it OFF is the
                 escape hatch for the CLI streaming-interleaving 400 ("thinking
                 blocks ... cannot be modified"): a thinking-free session can't
                 produce the interleaved blocks that trip the API. Per-session,
                 PATCH {thinking}; rebuilds the client on next turn. Shown for
                 ALL providers whose endpoint honors the thinking config
                 (provider-level supports_thinking from /api/chat/providers) —
                 hidden only for vendors that reject it (e.g. Qianfan), where
                 the switch would be a no-op. -->
            <!-- HIDDEN 2026-05-31: the bundled CLI (2.1.150, what the SDK
                 actually runs — NOT the system claude on PATH) doesn't honor
                 `--thinking disabled` on current-gen models — Opus 4.7+ and
                 DeepSeek reason adaptively regardless — so the toggle had no
                 visible effect. Backend plumbing + JS left intact; flip
                 x-show back to `_supportsThinking(model)` to restore once the
                 CLI/model actually supports turning thinking off. -->
            <label class="chat-toolbar-think"
                   x-show="false"
                   :title="t('thinking.title')">
              <input type="checkbox" x-model="thinkingEnabled" @change="onThinkingChange()">
              <span x-text="t('thinking.label')"></span>
            </label>
            <!-- Context ring — % used. Click (either button) opens the SDK
                 breakdown popup, which carries the Compact action.

                 2026-07-25: click used to fire compaction directly and the
                 breakdown was bound to @contextmenu. On a phone that meant the
                 ring's only reachable behaviour was "start a compact" — the
                 number it displays was unreadable (title needs hover) and the
                 breakdown was unreachable (no right-click). The ring is first
                 and foremost a READOUT, so tapping it should explain itself;
                 compaction is the decision you make after reading. `.stop` is
                 required or the same click bubbles to the popup's
                 @click.outside and closes it immediately. -->
            <button class="chat-toolbar-ring"
                    :class="{
                      warn: activeSessionPane().sessionUsage.context_used_pct >= 70 && activeSessionPane().sessionUsage.context_used_pct < 90,
                      danger: activeSessionPane().sessionUsage.context_used_pct >= 90,
                    }"
                    @click.stop="showCtxBreakdown()"
                    @contextmenu.prevent.stop="showCtxBreakdown()"
                    :title="ctxRingTitle()">
              <svg viewBox="0 0 20 20" width="18" height="18">
                <circle cx="10" cy="10" r="7" fill="none"
                        stroke="var(--c-bg-4)" stroke-width="2.5"/>
                <circle cx="10" cy="10" r="7" fill="none"
                        stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-dasharray="43.98"
                        :stroke-dashoffset="43.98 * (1 - Math.min(100, activeSessionPane().sessionUsage.context_used_pct||0) / 100)"
                        transform="rotate(-90 10 10)"/>
              </svg>
            </button>
            <!-- Subscription quota badge. Claude uses SDK rate_limit events.
                 Codex Gateway has no authoritative provider quota feed here,
                 so it is hidden like other third-party / API-key providers. -->
            <span class="chat-toolbar-rl"
                  x-show="currentQuotaBadge()"
                  :class="{ warn: currentQuotaBadge() && currentQuotaBadge().warn && !currentQuotaBadge().crit,
                            crit: currentQuotaBadge() && currentQuotaBadge().crit,
                            codex: _isCodexModel(model) }"
                  @click="currentQuotaBadge() && toast(rlBadgeDesc(), currentQuotaBadge().crit ? 'error' : (currentQuotaBadge().warn ? 'warn' : 'info'))"
                  :title="rlBadgeDesc()">
              <svg viewBox="0 0 24 24" width="13" height="13"><use href="#i-gauge"/></svg>
              <span class="chat-toolbar-rl-text" x-text="currentQuotaText()"></span>
            </span>
            <span class="chat-toolbar-spacer"></span>
            <!-- Send stays visible. Internal submission phases are represented
                 only by the button spinner; no transport status text is exposed.
                 Streaming, compact and queued work remain routable states. -->
            <button @click="send()"
                    :disabled="composerClaimed(currentId) || !!composerDisabledReason(currentId)"
                    class="btn-primary chat-toolbar-send chat-toolbar-queue"
                    :aria-busy="composerClaimed(currentId)"
                    :aria-label="sendButtonHint(currentId)"
                    :title="sendButtonHint(currentId)">
              <span class="spinner-sm"
                    x-show="composerClaimed(currentId)"></span>
              <span class="icon"
                    x-show="!composerClaimed(currentId)"><svg><use href="#i-send"/></svg></span>
              <span class="chat-toolbar-queue-badge"
                    x-show="_currentQueueLen() > 0"
                    x-text="_currentQueueLen()"></span>
            </button>
            <button x-show="isTabStreaming(currentId)" @click="stop()"
                    class="btn-danger chat-toolbar-send chat-toolbar-stop"
                    :disabled="workspaceSwitching || !!(tabState[currentId] && tabState[currentId]._stopping)"
                    :aria-label="t('btn.stop')"
                    :title="t('btn.stop') + ' (Esc)'">
              <span class="icon"><svg><use href="#i-square"/></svg></span>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Mobile tab bar — only shown via CSS @media on narrow viewports.
         Sits as a sibling of the panes in the same grid; on mobile, the panes
         become full-width and we swap which one is visible via mobileTab. -->
    <nav class="mobile-tab-bar" x-show="authed">
      <button :class="{active: mobileTab==='files'}" @click="setMobileTab('files')">
        <span class="icon"><svg><use href="#i-folder"/></svg></span>
        <span x-text="t('pane.files')"></span>
      </button>
      <button :class="{active: mobileTab==='chat'}" @click="setMobileTab('chat')">
        <span class="icon"><svg><use href="#i-brain"/></svg></span>
        <span x-text="t('pane.chat')"></span>
      </button>
      <button :class="{active: mobileTab==='preview'}" @click="setMobileTab('preview')">
        <span class="icon"><svg><use href="#i-file-text"/></svg></span>
        <span x-text="t('pane.preview')"></span>
      </button>
    </nav>

    <!-- File, conversation, and preview data resolve independently. Keep the
         previous surface visually coherent until the target workspace has
         committed, then reveal all three panes in one paint. -->
    <div class="workspace-switch-shield" x-show="workspaceSurfaceTransition"
         x-transition:leave.opacity.duration.120ms x-cloak
         role="status" aria-live="polite">
      <div class="workspace-switch-status">
        <span class="spinner-sm" aria-hidden="true"></span>
        <span x-text="t('workspace.switching')"></span>
      </div>
    </div>

  </div>

  <!-- Parent-DOM selection helper for file previews and chat bubbles. HTML
       stays sandboxed and PDF is browser-owned, so neither browsing context
       is inspected here. Quote adds a removable context chip to the visible
       composer. Ask creates a separate lightweight branch and keeps its
       answer inside this compact panel until the user explicitly opens it. -->
  <div class="preview-selection-popover"
       x-ref="previewSelectionPopover"
       x-show="authed && previewQuote.show"
       x-cloak
       :class="{
         'place-above': previewQuote.above,
         'is-asking': previewQuote.mode === 'ask',
         'is-dragged': previewQuote.dragged,
         'is-dragging': previewQuote.dragging,
       }"
       :style="{
         left: previewQuote.x + 'px',
         top: previewQuote.y + 'px',
         '--preview-question-width': previewQuote.width + 'px',
         '--preview-question-height': previewQuote.height + 'px',
       }"
       role="dialog"
       :aria-label="previewQuote.mode === 'ask'
         ? (lang === 'zh' ? '针对选中内容询问' : 'Ask about selection')
         : (lang === 'zh' ? '选中内容操作' : 'Selection actions')"
       @pointerdown.stop
       @click.stop>
    <template x-if="previewQuote.mode === 'actions'">
      <div class="preview-selection-actions" role="toolbar"
           :aria-label="lang === 'zh' ? '选中内容操作' : 'Selection actions'">
        <button type="button"
                @pointerdown="activatePreviewSelectionAction($event, 'quote')"
                @click="activatePreviewSelectionAction($event, 'quote')"
                :title="lang === 'zh' ? '作为文本附件引用' : 'Attach as quoted text'">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 17h4V9H5v6a2 2 0 0 0 2 2Zm10 0h2V9h-6v6a2 2 0 0 0 2 2h2Z"/>
          </svg>
          <span x-text="lang === 'zh' ? '引用' : 'Quote'"></span>
        </button>
        <span class="preview-selection-divider" aria-hidden="true"></span>
        <button type="button"
                @pointerdown="activatePreviewSelectionAction($event, 'ask')"
                @click="activatePreviewSelectionAction($event, 'ask')"
                :title="lang === 'zh' ? '展开独立侧问' : 'Open an independent side question'">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a7 7 0 0 0-4.7 12.2L6 20l4.2-1.4A7 7 0 1 0 12 3Zm0 3.1a2.7 2.7 0 0 1 1.2 5.1c-.8.4-1.2.8-1.2 1.6v.3h-1.8v-.5c0-1.3.6-2.1 1.8-2.7.6-.3.9-.8.9-1.3 0-.7-.5-1.2-1.3-1.2-.7 0-1.3.4-1.8 1.1L8.5 7.4A4 4 0 0 1 12 6.1Zm-1.9 8.4H12V16h-1.9v-1.5Z"/>
          </svg>
          <span x-text="lang === 'zh' ? '询问' : 'Ask'"></span>
        </button>
      </div>
    </template>
    <template x-if="previewQuote.mode === 'ask'">
      <div class="preview-selection-ask-shell"
           @pointerdown="startPreviewQuoteDrag($event)"
           @pointermove="movePreviewQuoteDrag($event)"
           @pointerup="finishPreviewQuoteDrag($event)"
           @pointercancel="finishPreviewQuoteDrag($event)"
           @lostpointercapture="finishPreviewQuoteDrag($event)">
        <form class="preview-selection-ask"
              x-show="!previewQuote.askSessionId"
              @submit.prevent="sendPreviewSelectionQuestion()">
          <div class="preview-selection-ask-head">
            <div class="preview-selection-source">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use :href="previewQuoteSourceIcon()"/></svg>
              <span x-text="previewQuoteSourceName()"
                    :title="previewQuote.source === 'preview' ? previewQuote.path : previewQuoteSourceName()"></span>
              <small x-show="previewQuote.truncated"
                     x-text="lang === 'zh' ? '已截断' : 'truncated'"></small>
            </div>
            <span class="preview-selection-drag-grip" aria-hidden="true"
                  :title="lang === 'zh' ? '拖动窗口' : 'Drag window'">
              <svg viewBox="0 0 12 18"><circle cx="3" cy="4" r="1"/><circle cx="9" cy="4" r="1"/><circle cx="3" cy="9" r="1"/><circle cx="9" cy="9" r="1"/><circle cx="3" cy="14" r="1"/><circle cx="9" cy="14" r="1"/></svg>
            </span>
            <button type="button" class="preview-selection-close"
                    @click="dismissPreviewQuote(true)"
                    :title="lang === 'zh' ? '取消' : 'Cancel'">×</button>
          </div>
          <blockquote class="preview-selection-excerpt" x-text="previewQuoteExcerpt()"></blockquote>
          <textarea x-model="previewQuote.question"
                    x-ref="previewQuoteInput"
                    rows="2"
                    autocomplete="off"
                    :placeholder="lang === 'zh' ? '针对这段内容询问…' : 'Ask about this selection…'"
                    @compositionstart="onLocalImeCompositionStart($event)"
                    @compositionend="onLocalImeCompositionEnd($event)"
                    @beforeinput="onLocalImeBeforeInput($event)"
                    @input="onLocalImeInput($event)"
                    @keydown="onLocalImeKeydown($event)"
                    @keydown.enter="onPreviewQuoteAskEnter($event)"
                    @keyup.enter="onImeEnterKeyup($event)"
                    @keydown.escape.stop.prevent="dismissPreviewQuote(true)"></textarea>
          <div class="preview-selection-error" x-show="previewQuote.askError"
               x-text="previewQuote.askError"></div>
          <div class="preview-selection-ask-foot">
            <span x-text="lang === 'zh' ? '将展开为独立侧问' : 'Opens as a separate side question'"></span>
            <button type="submit" class="preview-selection-send"
                    :disabled="!previewQuote.question.trim() || previewQuote.sending || !currentId || workspaceSwitching || !availableModels.length"
                    :title="lang === 'zh' ? '开始侧问' : 'Start side question'">
              <span class="spinner-sm" x-show="previewQuote.sending"></span>
              <svg x-show="!previewQuote.sending" aria-hidden="true"><use href="#i-send"/></svg>
            </button>
          </div>
        </form>

        <div class="preview-selection-answer" x-show="previewQuote.askSessionId">
          <div class="preview-selection-ask-head">
            <div class="preview-selection-source">
              <svg aria-hidden="true"><use href="#i-fork"/></svg>
              <span x-text="lang === 'zh' ? '独立侧问' : 'Side question'"></span>
            </div>
            <span class="preview-selection-drag-grip" aria-hidden="true"
                  :title="lang === 'zh' ? '拖动窗口' : 'Drag window'">
              <svg viewBox="0 0 12 18"><circle cx="3" cy="4" r="1"/><circle cx="9" cy="4" r="1"/><circle cx="3" cy="9" r="1"/><circle cx="9" cy="9" r="1"/><circle cx="3" cy="14" r="1"/><circle cx="9" cy="14" r="1"/></svg>
            </span>
            <button type="button" class="preview-selection-close"
                    @click="dismissPreviewQuote(true)"
                    :title="lang === 'zh' ? '关闭' : 'Close'">×</button>
          </div>
          <div class="preview-selection-conversation"
               @scroll.passive="onPreviewSelectionAskScroll($event)"
               x-effect="previewSelectionAskText(); $nextTick(() => scrollPreviewSelectionAskConversation())">
            <template x-for="(message, index) in previewSelectionAskConversation()"
                      :key="message._key || message.id || message.uuid || index">
              <div class="preview-selection-turn"
                   :class="message.role === 'user' ? 'is-user' : 'is-assistant'">
                <template x-if="message.role === 'user'">
                  <div class="preview-selection-question"
                       x-text="previewSelectionAskUserText(message)"></div>
                </template>
                <template x-if="message.role === 'assistant'">
                  <div class="preview-selection-answer-body markdown"
                       x-html="previewSelectionAskMessageHtml(message)"></div>
                </template>
              </div>
            </template>
            <div class="preview-selection-answer-loading"
                 x-show="previewSelectionAskRunning()">
              <span class="spinner-sm"></span>
              <span x-text="previewSelectionAskSearching()
                ? (lang === 'zh' ? '正在检索网页…' : 'Searching the web…')
                : (lang === 'zh' ? '正在回答…' : 'Answering…')"></span>
            </div>
          </div>
          <div class="preview-selection-error"
               x-show="previewQuote.askError || previewSelectionAskFailed()"
               x-text="previewQuote.askError || (lang === 'zh' ? '侧问没有完成，可打开会话重试' : 'The side question did not finish; open the chat to retry')"></div>
          <form class="preview-selection-followup"
                @submit.prevent="sendPreviewSelectionFollowup()">
            <textarea x-model="previewQuote.followup"
                      rows="2"
                      autocomplete="off"
                      :placeholder="lang === 'zh' ? '继续追问…' : 'Ask a follow-up…'"
                      @compositionstart="onLocalImeCompositionStart($event)"
                      @compositionend="onLocalImeCompositionEnd($event)"
                      @beforeinput="onLocalImeBeforeInput($event)"
                      @input="onLocalImeInput($event)"
                      @keydown="onLocalImeKeydown($event)"
                      @keydown.enter="onPreviewQuoteFollowupEnter($event)"
                      @keyup.enter="onImeEnterKeyup($event)"
                      @keydown.escape.stop.prevent="dismissPreviewQuote(true)"></textarea>
            <button type="submit" class="preview-selection-followup-send"
                    :disabled="!previewQuote.followup.trim() || previewSelectionAskRunning() || workspaceSwitching"
                    :title="lang === 'zh' ? '发送追问' : 'Send follow-up'">
              <svg aria-hidden="true"><use href="#i-send"/></svg>
            </button>
          </form>
          <div class="preview-selection-ask-foot">
            <span x-text="lang === 'zh' ? '独立多轮 · 可网页搜索' : 'Independent thread · Web search enabled'"></span>
            <button type="button" class="preview-selection-open"
                    @click="openPreviewSelectionAskSession()"
                    :title="lang === 'zh' ? '打开完整分支会话' : 'Open the full branch chat'">
              <svg aria-hidden="true"><use href="#i-chevron-right"/></svg>
              <span x-text="lang === 'zh' ? '打开会话' : 'Open chat'"></span>
            </button>
          </div>
        </div>
        <template x-for="edge in ['n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw']" :key="edge">
          <span class="preview-selection-resize-handle"
                :class="'is-' + edge"
                aria-hidden="true"
                @pointerdown.stop="startPreviewQuoteResize($event, edge)"
                @pointermove.stop="movePreviewQuoteResize($event)"
                @pointerup.stop="finishPreviewQuoteResize($event)"
                @pointercancel.stop="finishPreviewQuoteResize($event)"
                @lostpointercapture.stop="finishPreviewQuoteResize($event)"></span>
        </template>
      </div>
    </template>
  </div>

  <!-- One predictable OS-file drop surface for the whole application.
       Pointer events stay on the content underneath so a directory row can
       be the only explicit nested destination; every other location routes
       to the current workspace root. -->
  <div class="global-file-drop-overlay"
       x-show="authed && osFileDragging"
       x-transition.opacity
       x-cloak
       :class="{ 'into-directory': osFileDropOnDirectory }"
       role="status" aria-live="polite">
    <div class="global-file-drop-card">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
      </svg>
      <strong x-text="osFileDropOnDirectory
        ? (lang === 'zh' ? '上传到 /' + osFileDropDir : 'Upload to /' + osFileDropDir)
        : (lang === 'zh' ? '上传到工作区根目录' : 'Upload to workspace root')"></strong>
      <span x-text="lang === 'zh' ? '松开鼠标以上传' : 'Release to upload'"></span>
    </div>
  </div>

  <!-- ============ Message outline modal ============
       Lists every user prompt in the current session; tap a row to scroll
       chat to that message + flash highlight. Entry point: chat-tabs-actions
       outline button (☰). On mobile this slides up as a bottom sheet, on
       desktop it centers as a normal modal. -->
  <div class="msg-outline-modal" x-show="msgOutlineOpen"
       x-transition.opacity
       @click.self="closeMessageOutline()">
    <div class="msg-outline-panel" tabindex="-1"
         @click.stop
         @keydown.escape.stop.prevent="closeMessageOutline()"
         @keydown.tab="trapDialogFocus($event, 'message-outline')"
         role="dialog" aria-modal="true" aria-labelledby="msg-outline-title">
      <div class="msg-outline-head">
        <span id="msg-outline-title" class="msg-outline-label"
              x-text="(lang==='zh' ? '会话目录 ' : 'Outline ') + '(' + outlineMessages().length + ')'"></span>
        <button type="button" class="msg-outline-close" @click="closeMessageOutline()"
                :title="lang==='zh' ? '关闭 (Esc)' : 'Close (Esc)'"
                :aria-label="lang==='zh' ? '关闭会话目录' : 'Close conversation outline'">×</button>
      </div>
      <ul class="msg-outline-list">
        <template x-for="(m, i) in outlineMessages()" :key="m.uuid || m._k || ('o-' + i)">
          <li>
            <button type="button" class="msg-outline-item"

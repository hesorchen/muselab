        <button @click="toggleFilesPane()" class="icon-btn pane-side-toggle"
                :title="desktopFullPane
                  ? (lang==='zh' ? '退出全屏并显示文件区' : 'Exit fullscreen & show files')
                  : (leftOpen ? t('btn.hide_left') : t('btn.show_left'))">
          <svg x-show="leftOpen && !desktopFullPane"><use href="#i-chevron-left"/></svg>
          <svg x-show="!leftOpen || desktopFullPane"><use href="#i-chevron-right"/></svg>
        </button>
        <span class="pane-title">
          <span class="muse-mascot sm" :class="{'greet': mascotGreet, 'is-streaming': activeSessionPane().streaming}"
                @click="cycleMascot()" :title="mascotLabel() + (lang==='zh'?'（点击换一位）':' (click for next muse)')">
            <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
          </span>
          <span x-text="t('pane.chat')"></span>
        </span>
        <span class="spacer"></span>
        <!-- Global task center is the first action after the title spacer. -->
        <button class="activity-center-btn" type="button" @click="openActivityCenter()"
                :class="{ active: activity.summary.running || activity.summary.unread, danger: activity.summary.attention }"
                :title="lang==='zh' ? '全局任务中心' : 'Global activity center'">
          <!-- Inbox, not the generic list glyph: `i-list` also marks the tab
               picker and the scheduler section, so three unrelated surfaces
               were sharing one shape. An inbox says "things arrived for you". -->
          <svg><use href="#i-inbox"/></svg>
          <span class="activity-running" x-show="activity.summary.running" aria-hidden="true"></span>
          <span class="activity-unread" x-show="activity.summary.unread" aria-hidden="true"></span>
        </button>
        <button class="session-todo-btn icon-btn" type="button"
                @click="toggleSessionTodoBoard()"
                :class="{ active: sessionTodoOpen, 'has-active': sessionTodoCount(false) }"
                :aria-expanded="sessionTodoOpen"
                :title="lang==='zh' ? '待办事项' : 'Global TODOs'">
          <svg><use href="#i-check-circle"/></svg>
          <span class="session-todo-badge" aria-hidden="true"
                x-show="sessionTodoIndicatorPriority()"
                :class="'is-' + sessionTodoIndicatorPriority()"></span>
        </button>
        <button class="icon-btn" type="button" @click="openMemoryCenter()"
                :title="lang==='zh' ? '记忆中心' : 'Memory Center'"
                :aria-label="lang==='zh' ? '打开记忆中心' : 'Open Memory Center'">
          <svg><use href="#i-brain"/></svg>
        </button>
        <!-- 2026-07-25: removed the mobile-only terminal shortcut that used to
             sit here. The terminal is a preview-pane surface and the preview
             header already carries `.terminal-manager-btn`, so this was a
             second button for the same thing — competing for the scarcest row
             in the mobile UI. Entry point is now the preview header only. -->
        <!-- Skills + MCP drawer toggles. 2026-05-29: 从 chat-input 底 bar 移到
             顶 bar，与其它「能力 / 会话」入口（定时任务、命令面板）
             并列；底 bar 只留 attach / 模型 / 权限 / effort / context ring 等
             与「这一轮怎么发」直接相关的控件。两者都回答「这个会话有哪些能力
             可用」，放顶 bar 更符合其全局属性，也给移动端底 bar 腾出空间。-->
        <button @click="toggleSkillsDrawer()" class="icon-btn"
                :title="t('set.skills.drawer_open')"
                aria-label="Open skills list">
          <svg><use href="#i-puzzle"/></svg>
        </button>
        <button @click="openImageGen()" class="icon-btn"
                :title="lang==='zh' ? 'Codex Image 2 生图' : 'Codex Image 2 image generation'"
                aria-label="Codex Image 2">
          <svg><use href="#i-image"/></svg>
        </button>
        <button @click="toggleMcpDrawer()" class="icon-btn"
                :title="(lang==='zh'?'MCP 服务 (':'MCP servers (') + mcp.servers.length + ')'"
                aria-label="Open MCP servers">
          <svg><use href="#i-plug"/></svg>
        </button>

        <!-- Manual hard-refresh escape hatch. When the chat pane gets
             stuck (SSE wedged, Alpine state out of sync after a flaky
             reconnect, etc.), users have no way out except closing the
             browser tab or PWA. `location.reload()` is the bluntest fix
             but always works — loadPrefs restores currentId / openTabIds
             / preview state on boot, and the SSE auto-reconnect path
             picks up any still-running backend turn. The toast gives a
             visible confirmation so the user knows the click registered
             before the page actually unloads. -->
        <button @click="reloadApp()" class="icon-btn"
                :title="lang==='zh' ? '重新加载（卡住时的兜底：完整刷新页面，等同关掉再打开）' : 'Reload (escape hatch when stuck: full page reload, like closing and reopening)'"
                aria-label="Reload app">
          <svg><use href="#i-refresh"/></svg>
        </button>
        <!-- Desktop fullscreen toggle — pair of preview-pane's button. Click
             → chat pane takes whole viewport for immersive conversation;
             click again or ESC → restore 3-column. Hidden on mobile (the
             single-pane @media already covers focus mode there). -->
        <button @click="toggleDesktopFull('chat')" class="icon-btn pane-fullscreen-btn"
                :title="desktopFullPane==='chat' ? (lang==='zh' ? '退出全屏' : 'Exit fullscreen') : (lang==='zh' ? '全屏聊天' : 'Fullscreen chat')"
                :aria-pressed="desktopFullPane==='chat'">
          <svg x-show="desktopFullPane!=='chat'"><use href="#i-maximize"/></svg>
          <svg x-show="desktopFullPane==='chat'"><use href="#i-minimize"/></svg>
        </button>
        <!-- Scheduled-tasks bell — unread badge when any scheduled
             prompt has produced output since the user last opened
             the drawer. Heartbeat keeps the count fresh. -->
        <button @click="openScheduler()" class="icon-btn bell-btn"
                :title="lang==='zh' ? '定时任务' : 'Scheduled tasks'"
                aria-label="Scheduled tasks">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="bell-badge" x-show="scheduler.unreadCount > 0"
                x-text="scheduler.unreadCount > 99 ? '99+' : scheduler.unreadCount"></span>
        </button>
        <!-- Command palette entry — slim icon-btn alongside settings.
             Discoverability comes from the first-run toast (init()) +
             a tooltip showing the keyboard shortcut. Visual weight is
             intentionally low so the palette doesn't read as "chat
             search" — it's app-global. -->
        <button @click="openPalette()" class="icon-btn chat-head-palette"
                :title="lang==='zh' ? '命令面板  ⌘K' : 'Command palette  ⌘K'"
                aria-label="Command palette">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <button @click="openSettings()" class="icon-btn" :title="t('btn.settings')"><svg><use href="#i-settings"/></svg></button>
        <button @click="togglePreviewPane()" class="icon-btn pane-side-toggle"
                :title="desktopFullPane
                  ? (lang==='zh' ? '退出全屏并显示预览区' : 'Exit fullscreen & show preview')
                  : (previewOpen ? t('btn.hide_preview') : t('btn.show_preview'))">
          <svg x-show="previewOpen && !desktopFullPane"><use href="#i-chevron-right"/></svg>
          <svg x-show="!previewOpen || desktopFullPane"><use href="#i-chevron-left"/></svg>
        </button>
      </header>

      <!-- Context breakdown popup — shows SDK get_context_usage() output
           with per-category token counts so the user can see which slice
           (system prompt / tools / memory / messages / mcp) is dominating. -->
      <div x-show="ctxBreakdown.show"
           @click.outside="ctxBreakdown.show = false"
           x-transition.opacity
           class="ctx-breakdown-pop">
        <div class="ctx-breakdown-head">
          <span x-text="lang==='zh' ? 'Context 拆分（SDK）' : 'Context breakdown (SDK)'"></span>
          <button class="icon-btn sm"
                  :title="lang==='zh' ? '关闭' : 'Close'"
                  @click="ctxBreakdown.show = false">×</button>
        </div>
        <div x-show="ctxBreakdown.loading" class="ctx-breakdown-body"
             x-text="lang==='zh' ? '查询中…' : 'Loading…'"></div>
        <div x-show="ctxBreakdown.error && !ctxBreakdown.loading"
             class="ctx-breakdown-body err" x-text="ctxBreakdown.error"></div>
        <template x-if="ctxBreakdown.view && !ctxBreakdown.loading">
          <div class="ctx-breakdown-body">
            <div class="ctx-breakdown-summary"
                 x-text="((ctxBreakdown.data.totalTokens||0)/1000).toFixed(1) + 'K / ' + ((ctxBreakdown.data.maxTokens||0)/1000).toFixed(0) + 'K (' + (ctxBreakdown.data.percentage||0).toFixed(1) + '%)'"></div>
            <div class="ctx-breakdown-summary"
                 x-text="ctxBreakdownAccuracyLabel()"></div>
            <!-- Stacked bar — one segment per OCCUPIED category, width relative
                 to maxTokens. The unfilled remainder of the track IS the free
                 space, so "Free space" is deliberately not a segment: as a peer
                 it was the largest bar in the popup and squashed everything
                 real. Deferred rows are excluded too — they aren't in
                 totalTokens and used to overflow the track by 4%. -->
            <div class="ctx-breakdown-stack">
              <template x-for="cat in ctxBreakdown.view.used" :key="cat.name">
                <div class="ctx-breakdown-stack-seg"
                     :style="`width: ${ctxCategoryPct(cat)}%; background: ${ctxCategoryColor(cat)}`"
                     :title="cat.name + ' · ' + ctxFormatTokens(cat.tokens)"></div>
              </template>
            </div>
            <template x-for="cat in ctxBreakdown.view.used" :key="cat.name">
              <div>
                <div class="ctx-breakdown-row"
                     :class="{ expandable: ctxRowChildren(cat.name).length, expanded: ctxExpanded[cat.name] }"
                     @click="ctxToggleRow(cat.name)">
                  <span class="ctx-breakdown-swatch"
                        :style="`background: ${ctxCategoryColor(cat)}`"></span>
                  <span class="ctx-breakdown-name" :title="cat.name" x-text="cat.name"></span>
                  <span class="ctx-breakdown-tokens"
                        x-text="ctxFormatTokens(cat.tokens)"></span>
                  <span class="ctx-breakdown-pct" x-text="ctxPctLabel(cat)"></span>
                  <span class="ctx-breakdown-caret"
                        x-show="ctxRowChildren(cat.name).length"
                        x-text="ctxExpanded[cat.name] ? '▾' : '▸'"></span>
                </div>
                <template x-if="ctxExpanded[cat.name] && ctxRowChildren(cat.name).length">
                  <div class="ctx-breakdown-sub">
                    <template x-for="item in ctxRowChildren(cat.name)" :key="item.title + '-' + item.tokens">
                      <div class="ctx-breakdown-subrow" :title="item.title">
                        <span class="ctx-breakdown-subname" x-text="item.label"></span>
                        <span class="ctx-breakdown-submeta" x-show="item.meta" x-text="item.meta"></span>
                        <span class="ctx-breakdown-subtokens"
                              x-text="ctxFormatTokens(item.tokens)"></span>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
            <!-- Remainder, stated once as a plain figure. No swatch —
                 it isn't a slice of anything, it's what's left of the track
                 above. -->
            <div class="ctx-breakdown-row free">
              <span class="ctx-breakdown-name"
                    x-text="lang==='zh' ? '剩余' : 'Free space'"></span>
              <span class="ctx-breakdown-tokens"
                    x-text="ctxFormatTokens(ctxBreakdown.view.freeTokens)"></span>
              <span class="ctx-breakdown-pct"
                    x-text="ctxPctLabel({ tokens: ctxBreakdown.view.freeTokens })"></span>
              <span class="ctx-breakdown-caret"></span>
            </div>
            <!-- Deferred tool schemas: real budget, but budget NOT spent —
                 absent from totalTokens and from the SDK's own gridRows. Kept
                 visible (it's what ToolSearch buys us) and kept clearly
                 separate so it can't be read as occupancy. -->
            <template x-if="ctxBreakdown.view.deferred.length">
              <div class="ctx-breakdown-deferred">
                <div class="ctx-breakdown-deferred-head"
                     x-text="(lang==='zh' ? '未计入（按需加载，已省下 ' : 'Not counted (loaded on demand, saves ')
                             + ctxFormatTokens(ctxBreakdown.view.deferredTotal)
                             + (lang==='zh' ? '）' : ')')"></div>
                <template x-for="cat in ctxBreakdown.view.deferred" :key="cat.name">
                  <div>
                    <div class="ctx-breakdown-row deferred"
                         :class="{ expandable: ctxRowChildren(cat.name).length, expanded: ctxExpanded[cat.name] }"
                         @click="ctxToggleRow(cat.name)">
                      <span class="ctx-breakdown-swatch hollow"
                            :style="`border-color: ${ctxCategoryColor(cat)}`"></span>
                      <span class="ctx-breakdown-name" :title="cat.name" x-text="cat.name"></span>
                      <span class="ctx-breakdown-tokens"
                            x-text="ctxFormatTokens(cat.tokens)"></span>
                      <!-- No % here on purpose: deferred tokens are not in
                           totalTokens, so a share-of-window figure would be
                           read as occupancy. Empty span keeps the column
                           aligned with the counted rows above. -->
                      <span class="ctx-breakdown-pct"></span>
                      <span class="ctx-breakdown-caret"
                            x-show="ctxRowChildren(cat.name).length"
                            x-text="ctxExpanded[cat.name] ? '▾' : '▸'"></span>
                    </div>
                    <template x-if="ctxExpanded[cat.name] && ctxRowChildren(cat.name).length">
                      <div class="ctx-breakdown-sub">
                        <template x-for="item in ctxRowChildren(cat.name)" :key="item.title + '-' + item.tokens">
                          <div class="ctx-breakdown-subrow" :title="item.title">
                            <span class="ctx-breakdown-subname" x-text="item.label"></span>
                            <span class="ctx-breakdown-submeta" x-show="item.meta" x-text="item.meta"></span>
                            <span class="ctx-breakdown-subtokens"
                                  x-text="ctxFormatTokens(item.tokens)"></span>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
            <div class="ctx-breakdown-hint"
                 x-text="lang==='zh' ? '说明：tools / system prompt 是 Claude Code CLI 内置；memoryFiles 是 CLAUDE.md union；messages 含所有历史 + tool_result' : 'Note: tools / system_prompt are CLI built-in; memoryFiles is CLAUDE.md union; messages include full history + tool results'"></div>
          </div>
        </template>
        <!-- Compact lives here now that the ring itself opens this popup.
             Outside the x-if so it stays reachable when the breakdown failed
             to load — a 409 ("send a message first") is exactly the moment a
             long session might still want compacting. -->
        <div class="ctx-breakdown-actions">
          <button class="btn-ghost sm"
                  @click="ctxBreakdown.show = false; runCompact()"
                  x-text="lang==='zh' ? '压缩对话…' : 'Compact session…'"></button>
        </div>
      </div>

      <!-- Tab strip — like VS Code Claude. Each tab is an open session;
           click switches, double-click renames inline, right-click opens
           the context menu (rename / close / export Markdown / delete).
           The picker on the right is the "history" entry point: clicking a
           row promotes that session into a tab. -->
      <!-- Two-container layout: .chat-tabs-list scrolls horizontally when tabs
           overflow; .chat-tabs-actions stays pinned right (new-session + history
           picker always visible regardless of how many tabs are open). -->
      <div class="chat-tabs-wrap">
        <!-- History picker — leftmost slot so it's the first thing the
             eye hits on the top bar. Click opens the all-sessions picker
             (search + grouped list); click a row to open it as a tab. -->
        <div class="session-picker chat-tab-history" @click.outside="closeHistoryPicker(false)">
          <button id="history-picker-trigger" class="chat-tab-history-btn"
                  @click="toggleHistoryPicker($event)" type="button"
                  aria-haspopup="dialog" aria-controls="history-picker-pop"
                  :aria-expanded="sessionPickerOpen"
                  :aria-label="lang==='zh' ? '历史会话' : 'Session history'"
                  :title="lang==='zh' ? '历史会话' : 'Session history'">
            <svg><use href="#i-history"/></svg>
          </button>
          <div x-show="sessionPickerOpen" x-transition.opacity.duration.150ms
               id="history-picker-pop"
               class="session-picker-pop"
               :style="historyPickerStyle"
               role="dialog"
               :aria-label="lang==='zh' ? '历史会话选择器' : 'Session history picker'"
               @keydown.escape="if (!_isImeComposingEvent($event)) { $event.stopPropagation(); $event.preventDefault(); closeHistoryPicker(); }">
            <input class="session-picker-search"
                   type="text"
                   x-model="sessionPickerSearch"
                   x-ref="sessionPickerSearchInput"
                   :placeholder="lang==='zh' ? '搜索会话名…' : 'Search sessions…'"
                   @input.debounce.300ms="_searchSessions()" />
            <template x-for="g in groupedFilteredSessions()" :key="g.key">
              <div class="session-picker-group">
                <div class="session-picker-group-label" x-text="g.label + (g.hiddenCount > 0 ? ' (' + g.items.length + ')' : '')"></div>
                <template x-for="s in g.visibleItems" :key="s.id">
                  <div class="session-picker-row"
                       :class="historyRowClass(s.id) + (s.pinned ? ' pinned' : '')"
                       @mouseenter="prefetchSession(s.id)"
                       @contextmenu.prevent="pickerRowMenu($event, s.id)">
                    <button class="session-picker-pin"
                            :class="{ active: s.pinned }"
                            x-show="renamingPickerSid !== s.id"
                            @click.stop="togglePinSession(s.id)"
                            :title="s.pinned ? (lang==='zh'?'取消置顶':'Unpin') : (lang==='zh'?'置顶':'Pin to top')">
                      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="17" x2="12" y2="22"/>
                        <path d="M5 17h14l-1.5-5H6.5L5 17z"/>
                        <path d="M9 12V5h6v7"/>
                      </svg>
                    </button>
                    <!-- Row content has two states:
                         a) normal — name + count + actions (rename / kebab / del)
                         b) renaming — inline input + ✓ commit / ✕ cancel
                         x-show (not x-if) keeps the input mounted so its
                         focus() call from pickerStartInlineRename stays in
                         the original user-gesture context (iOS Safari only
                         shows the on-screen keyboard for focus() inside the
                         same synchronous tick as the click). -->
                    <button class="session-picker-open" type="button"
                            x-show="renamingPickerSid !== s.id"
                            @click="pickerOpenSession(s.id)"
                            :aria-current="s.id === currentId ? 'page' : null"
                            :title="(lang==='zh' ? '打开会话：' : 'Open session: ') + s.name">
                      <!-- Streaming / unread dots — mirrors tab-strip behavior -->
                      <span class="chat-tab-stream-dot picker-status-dot"
                            :class="{ 'is-background': isTabBackgroundActive(s.id) }"
                            x-show="isTabRunning(s.id)"
                            :title="isTabBackgroundActive(s.id)
                              ? t('chat.background_running')
                              : (lang==='zh' ? '正在生成…' : 'Streaming…')"></span>
                      <span class="chat-tab-unread-dot picker-status-dot"
                            x-show="isTabUnread(s.id)"
                            :title="lang==='zh' ? '有新回复' : 'New reply ready'"></span>
                      <span class="ellipsis" x-text="s.name"></span>
                    </button>
                    <button class="session-picker-rename"
                            x-show="renamingPickerSid !== s.id"
                            @click="pickerStartInlineRename($event, s.id)"
                            :title="lang==='zh' ? '重命名' : 'Rename'">
                      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                      </svg>
                    </button>
                    <button class="session-picker-kebab"
                            x-show="renamingPickerSid !== s.id"
                            @click="pickerRowMenu($event, s.id)"
                            :title="lang==='zh' ? '更多操作' : 'More'">⋮</button>
                    <button class="session-picker-del"
                            x-show="renamingPickerSid !== s.id"
                            @click="pickerDeleteSession(s.id, $event)"
                            :title="lang==='zh' ? '删除此会话' : 'Delete this session'">×</button>
                    <!-- Renaming state: inline input + commit / cancel buttons -->
                    <input class="session-picker-rename-input"
                           type="text"
                           x-show="renamingPickerSid === s.id"
                           :data-sid="s.id"
                           x-model="pickerRenameDraft"
                           @click.stop
                           @keydown.enter="pickerCommitInlineRenameOnEnter($event)"
                           @keydown.escape.prevent="pickerCancelInlineRename()"
                           @blur="pickerCommitInlineRename()" />
                    <button class="session-picker-rename-ok"
                            x-show="renamingPickerSid === s.id"
                            @click.stop="pickerCommitInlineRename()"
                            :title="lang==='zh' ? '确定' : 'Save'">
                      <svg><use href="#i-check"/></svg>
                    </button>
                    <button class="session-picker-rename-cancel"
                            x-show="renamingPickerSid === s.id"
                            @click.stop="pickerCancelInlineRename()"
                            :title="lang==='zh' ? '取消' : 'Cancel'">
                      <svg><use href="#i-x"/></svg>
                    </button>
                  </div>
                </template>
                <!-- "展开更多" button — only when group is limited and has hidden items -->
                <button x-show="g.hiddenCount > 0"
                        class="session-picker-show-more"
                        @click.stop="pickerGroupExpanded = { ...pickerGroupExpanded, [g.key]: true }"
                        x-text="(lang==='zh' ? '展开更多 · ' : 'Show more · ') + g.hiddenCount + (lang==='zh' ? ' 条' : ' more')">
                </button>
              </div>
            </template>
            <div x-show="filteredSessions().length === 0" class="session-picker-empty"
                 x-text="lang==='zh' ? (sessionPickerSearch ? '没有匹配' : '暂无会话') : (sessionPickerSearch ? 'No match' : 'No sessions')"></div>
            <!-- Footer: one-click bulk-clear of stale history. Sits at the very
                 bottom of the list so it's out of the way of normal row clicks.
                 Hidden during a search (the visible set is filtered, so the
                 count would mislead). Deletes only sessions older than 7 days;
                 pinned + currently-open are always kept (see purgeOldSessions). -->
            <div class="session-picker-footer" x-show="!sessionPickerSearch && filteredSessions().length > 0">
              <button class="session-picker-clear-old"
                      @click.stop="purgeOldSessions()"
                      :title="lang==='zh' ? '删除 7 天前的会话（置顶和当前会话保留）' : 'Delete sessions older than 7 days (pinned & current kept)'">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
                </svg>
                <span x-text="lang==='zh' ? '清理 7 天前的会话' : 'Clear sessions older than 7 days'"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="chat-tabs-list" @wheel="onChatTabsWheel($event)">
          <template x-for="tid in workspaceOpenTabIds()" :key="tid">
            <div class="chat-tab" :class="{active: tid === currentId, 'drag-over': tabDragOverId === tid}"
                 :data-tid="tid"
                 :draggable="isPointerDevice"
                 @dragstart="onTabDragStart($event, tid)"
                 @dragover.prevent="onTabDragOver($event, tid)"
                 @dragleave="onTabDragLeave(tid)"
                 @drop.prevent="onTabDrop($event, tid)"
                 @dragend="onTabDragEnd()"
                 @click="activateTab(tid)"
                 @mouseenter="prefetchSession(tid)"
                 @dblclick="startRenameTab(tid)"
                 @contextmenu.prevent="showTabMenu($event, tid)"
                 @auxclick="onTabAuxClick($event, tid)"
                 :title="tabTitle(tid)">
              <span class="chat-tab-stream-dot"
                    :class="{ 'is-background': isTabBackgroundActive(tid) }"
                    x-show="isTabRunning(tid)"
                    :title="isTabBackgroundActive(tid)
                      ? t('chat.background_running')
                      : (lang==='zh' ? '该会话正在生成…' : 'Streaming…')"></span>
              <!-- Green dot when the tab finished a turn while you were
                   elsewhere. Sibling to the streaming dot but mutually
                   exclusive — streaming has priority since "still running"
                   is the more urgent visual state. -->
              <span class="chat-tab-unread-dot"
                    x-show="isTabUnread(tid)"
                    :title="lang==='zh' ? '该会话有新回复' : 'New reply ready'"></span>
              <!-- x-show, not x-if — keeps both nodes mounted so a blur on the
                   <input> doesn't unmount the very element dispatching the
                   event (which trips an Alpine null.node bug). -->
              <span class="chat-tab-name ellipsis"
                    x-show="renamingTabId !== tid"
                    x-text="(sessions.find(s => s.id === tid)?.name) || '…'"></span>
              <input class="chat-tab-rename-input" type="text" x-model="renameDraft"
                     :data-tid="tid"
                     x-show="renamingTabId === tid"
                     @click.stop @dblclick.stop
                     @blur="commitRenameTab()"
                     @keydown.enter="commitRenameTabOnEnter($event)"
                     @keydown.escape.prevent="cancelRenameTab()" />
              <!-- Kebab menu — only shown on mobile (CSS @media). Desktop uses
                   right-click which mobile browsers don't reliably synthesize. -->
              <button class="chat-tab-kebab" @click="showTabMenu($event, tid)"
                      :title="lang==='zh' ? '更多操作' : 'More'">⋮</button>
              <button class="chat-tab-close" @click="closeChatTab(tid, $event)"
                      :title="lang==='zh' ? '关闭 tab（中键也可）' : 'Close tab (middle-click also)'">×</button>
            </div>
          </template>
        </div>
        <div class="chat-tabs-actions">
          <!-- Per user request: top bar reduced to "history (left) + tabs
               strip (middle) + new (right)". Removed current-session chip
               (redundant once strip is visible) and outline button (moved
               to chat-pane FAB that aligns with .jump-bottom). -->
          <button class="chat-tab-new" @click="newSession()"
                  :title="t('btn.new_session')">+</button>
        </div>
      </div>

      <!-- Tab context menu (right-click). Stored in `tabCtxMenu` to avoid
           clashing with the file-tree's `ctxMenu` data (different shape). -->
      <template x-if="tabCtxMenu">
        <div class="tab-ctx-menu"
             :style="tabCtxMenuStyle()"
             @click.outside="closeTabMenu()"
             @keydown.escape.window="closeTabMenu()">
          <button @click="menuRename(tabCtxMenu && tabCtxMenu.id)"
                  x-text="lang==='zh' ? '重命名' : 'Rename'"></button>
          <button @click="menuClose(tabCtxMenu && tabCtxMenu.id)"
                  x-text="lang==='zh' ? '关闭 tab' : 'Close tab'"></button>
          <button @click="menuFork(tabCtxMenu && tabCtxMenu.id)"
                  :disabled="!canForkSession(tabCtxMenu && tabCtxMenu.id)"
                  x-text="forkingSessionId === (tabCtxMenu && tabCtxMenu.id)
                    ? (lang==='zh' ? '正在 Fork…' : 'Forking…')
                    : (lang==='zh' ? 'Fork 对话' : 'Fork conversation')"></button>
          <button @click="menuExportMarkdown(tabCtxMenu && tabCtxMenu.id)"
                  x-text="lang==='zh' ? '导出为 Markdown' : 'Export as Markdown'"></button>
          <button @click="menuCopySessionEvidence(tabCtxMenu && tabCtxMenu.id)"
                  x-text="lang==='zh' ? '复制会话证据 JSON' : 'Copy session evidence JSON'"></button>
          <hr/>
          <button class="danger" @click="menuDelete(tabCtxMenu && tabCtxMenu.id)"
                  x-text="lang==='zh' ? '删除会话' : 'Delete session'"></button>
        </div>
      </template>

      <!-- The legacy .session-bar (model + permission + thinking selectors)
           moved to the chat-input toolbar at the bottom (VSCode-style). -->

      <div class="chat-scroll-wrap">
        <!-- Position transcript controls against the area above the variable-
             height composer, so they never disappear behind queued items or
             the mobile keyboard toolbar. -->
        <div class="chat-transcript-wrap"
             x-data="{ get activeSession(){ return activeSessionPane() } }">
        <div class="chat-body" x-ref="chatBody" @scroll="onChatScroll()" @wheel.passive="_userScrollIntent($event)" @touchstart.passive="_chatTouchStart($event)" @touchmove.passive="_userScrollIntent($event)" @pointerdown.passive="_userScrollIntent($event)" @click="onChatClick($event)"
             :class="{ 'msgs-hidden': !activeSession.messagesReady && activeSession.messages.length }">
          <!-- Shimmer skeleton while loadSession is in-flight. Without
               this, switching to a long-history session briefly shows the
               brand-empty onboarding cards as if it were a new session. -->
          <div x-show="(activeSession.messagesLoading && !activeSession.messages.length)
                       || (!activeSession.messagesReady && activeSession.messages.length)"
               class="chat-skeleton" aria-hidden="true">
            <template x-for="i in 3" :key="i">
              <div class="chat-skeleton-msg">
                <div class="chat-skeleton-avatar"></div>
                <div class="chat-skeleton-bubble">
                  <div class="chat-skeleton-line"></div>
                  <div class="chat-skeleton-line"></div>
                  <div class="chat-skeleton-line"></div>
                </div>
              </div>
            </template>
          </div>
          <div x-show="!activeSession.messages.length && !activeSession.messagesLoading"
               class="brand-empty chat-empty">
            <span class="muse-mascot lg" :class="{'greet': mascotGreet}" @click="cycleMascot()">
              <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
            </span>
            <div class="brand-logo small">Muse · <span x-text="lang==='zh' ? mascot().zhName : mascot().greek"></span></div>
            <div class="brand-tagline">
              <span class="muse-domain" x-text="lang==='zh' ? mascot().domain.zh : mascot().domain.en"></span>
              · <span x-text="t('chat.runs_on')"></span> <span x-text="currentModelLabel()"></span>
            </div>

            <!-- Provider warn — first-priority blocker. Stays visible until
                 the user enables at least one provider in Settings. -->
            <template x-if="contextInfo._fetched && !contextInfo.has_any_provider">
              <div class="onboard-card warn">
                <div class="onboard-card-title" x-text="t('onboard.no_provider_title')"></div>
                <div class="onboard-card-body" x-text="t('onboard.no_provider_body')"></div>
                <button class="btn-primary" @click="openSettings()" x-text="t('onboard.no_provider_cta')"></button>
              </div>
            </template>

            <!-- The nine-muse grid and the state-aware opener bubble that
                 used to fill this screen are gone. They were an
                 introduction, and a returning user meets them on every new
                 chat — three rows of cards to scroll past before reaching
                 the composer. What is left is the same thing the screen
                 already showed the moment you began typing: the hero and a
                 short row of hints. Muses are still reachable from the
                 mascot itself (cycleMascot). -->
            <div class="brand-tips" x-transition.opacity.duration.200ms>
              <div class="brand-tip"><span class="kbd">@</span><span x-text="t('chat.empty_tip2')"></span></div>
            </div>
          </div>
          <!-- (The dedicated conv-outline-wrap I added here in eafb7ad has
               been removed in favor of the project's pre-existing
               msg-outline-modal — that's the floating round button users
               actually click. outlineMessages() now reads the same
               _backendOutline cache to stay accurate on lazy-loaded
               sessions.) -->

          <template x-if="currentForkSource()">
            <div class="fork-origin-banner">
              <svg aria-hidden="true"><use href="#i-fork"/></svg>
              <span x-text="lang==='zh' ? '分支自' : 'Forked from'"></span>
              <button type="button"
                      @click="openForkSource()"
                      x-text="currentForkSource()?.name || ''"></button>
            </div>
          </template>

          <!-- Long histories are count-paged explicitly. The browser receives and
               mounts only the newest 100 canonical blocks until the reader asks
               for the preceding page; reaching the top never starts background
               history work. -->
          <div x-show="hasMoreHistory()" class="load-earlier-wrap">
            <button type="button"
                    class="load-earlier-btn"
                    @click="loadEarlierMessages()"
                    :disabled="activeSession._loadingEarlier"
                    x-text="activeSession._loadingEarlier
                      ? t('history.load_earlier_loading')
                      : t('history.load_earlier', { n: earlierMessageCount() })"></button>
          </div>
          <div x-show="activeSession._historyHydrationError"
               class="load-earlier-wrap load-earlier-status"
               role="status"
               aria-live="polite"
               x-text="lang==='zh' ? '更早的会话历史加载失败，请重试' : 'Earlier history failed to load; retry'"></div>
          <!-- Per-message rendering — Alpine 3's reactivity worked
               reliably on this flat messages x-for. The "group into
               assistant turns" experiment broke streaming reactivity
               (text chunks stopped triggering re-render unless the
               user switched tabs), so we render each msg standalone
               and use CSS adjacent selectors at the end of styles.css
               to hide the avatar on all but the FIRST assistant-side
               msg in a run — visually the same "one avatar per turn"
               result without a derived data structure. -->
          <!-- Keep ten recent virtualized panes mounted as an LRU DOM cache.
               Hidden panes retain their keyed Alpine/Markdown view but remain out
               of layout; canonical messages still live only in tabState. -->
          <template x-for="tid in warmTranscriptTabIds()" :key="tid">
          <div class="msg-pane"
               x-show="tid === currentId"
               x-cloak
               :aria-hidden="tid === currentId ? null : 'true'"
               :data-tid="tid"
               x-data="{ get pane(){ return paneState(tid) }, get paneMsgs(){ return paneMessages(tid) }, get paneRows(){ return paneMessageRows(tid) } }">
          <template x-for="row in paneRows" :key="row.key">
            <div x-data="{ get m(){ return row.message }, get i(){ return row.index } }"
                 :class="row.spacer ? 'msg-virtual-spacer' : ('msg ' + (m._is_compact_summary ? 'compact' : m.role) + (isMsgRenderable(m, i, paneMsgs) ? '' : ' is-hidden') + (m._noAnim ? ' no-anim' : ''))"
                 :data-uuid="row.spacer ? '' : (m.uuid || '')"
                 :data-message-key="row.spacer ? '' : m._k"
                 :aria-hidden="row.spacer ? 'true' : null"
                 :style="row.spacer ? ('height:' + row.height + 'px') : ('contain-intrinsic-size: auto ' + messageIntrinsicH(pane, m) + 'px')">
              <!-- Per-message wall-clock (`mts`, backend). Deliberately NOT on
                   by default: an agentic turn is 30+ tool cards, and stamping
                   every one of them costs more attention than it returns —
                   the turn separator already answers "when" at the granularity
                   anyone actually asks it. It appears only once you EXPAND a
                   card, i.e. at the moment you're inspecting that specific
                   step and its time is a real question. Live-streamed cards
                   have no mts until the post-turn reconcile reloads canonical
                   history; absent time simply renders nothing. -->
              <div class="msg-time"
                   x-show="m.mts
                           && (m.role === 'tool_use' || m.role === 'tool_result'
                               || m.role === 'thinking')
                           && isMsgExpanded(i, m, false, pane, paneMsgs)"
                   x-text="m.mts ? fmtTurnTime(m.mts) : ''"></div>
              <!-- compact-summary pill + the summary itself.
                   The pill used to be the ONLY thing rendered for this
                   message — the summary body was dropped on the floor by
                   both the user- and assistant-branch `!m._is_compact_summary`
                   guards below. On a freshly-compacted session that is
                   catastrophic: the SDK's post-compact view contains exactly
                   ONE bubble (the summary), so the whole chat rendered as a
                   lone pill over an empty screen while promising "摘要在下面".
                   2026-07-25 user report: "啥也没有".
                   That report was fixed by TWO changes at once — rendering the
                   body at all, and defaulting it open while it was the pane's
                   last bubble. The second one turned out to be the wrong half:
                   a 10-20k-char summary unfurled on entry buries the actual
                   conversation, and the "last bubble" test stays true through
                   the whole next turn (nothing is appended until the first
                   muse-side msg lands), so a running turn reads as a wall of
                   summary. Collapsed by default now; the dead-end feel is
                   handled by the state-tracking label below, which says
                   "点击查看摘要" instead of promising a body that isn't there. -->
              <template x-if="m._is_compact_summary">
                <div class="compact-summary-block">
                  <button type="button" class="compact-summary-pill"
                          @click="toggleMsgExpanded(m, i, false)"
                          :aria-expanded="isMsgExpanded(i, m, false, pane, paneMsgs) ? 'true' : 'false'">
                    <!-- Label tracks the open state: promising "摘要在下面" while
                         collapsed is what made the old pill read as a dead end. -->
                    <span x-text="isMsgExpanded(i, m, false, pane, paneMsgs)
                                    ? (lang==='zh' ? '📦 上方对话已压缩 · 以下为摘要' : '📦 Conversation compacted · summary below')
                                    : (lang==='zh' ? '📦 上方对话已压缩 · 点击查看摘要' : '📦 Conversation compacted · tap to read summary')"></span>
                    <span class="compact-summary-caret"
                          x-text="isMsgExpanded(i, m, false, pane, paneMsgs) ? '▾' : '▸'"></span>
                  </button>
                  <div class="compact-summary-body"
                       x-show="isMsgExpanded(i, m, false, pane, paneMsgs)"
                       x-html="compactSummaryHtml(m)"></div>
                </div>
              </template>

              <!-- user message -->
              <template x-if="m.role === 'user' && !m._is_compact_summary">
                <div>
                  <div class="msg-row">
                    <span class="msg-avatar user-avatar" x-text="userAvatarText()"></span>
                    <div class="bubble user-bubble" @click="onUserBubbleClick(m)">
                      <template x-if="userSelectionQuotes(m).length">
                        <div class="user-msg-quotes">
                          <template x-for="(quote, qidx) in userSelectionQuotes(m)"
                                    :key="quote.id || ('quote-'+qidx)">
                            <div class="user-msg-quote"
                                 :title="previewQuoteExcerpt(quote)">
                              <svg aria-hidden="true"><use :href="previewQuoteSourceIcon(quote)"/></svg>
                              <div>
                                <strong x-text="previewQuoteSourceName(quote)"></strong>
                                <span x-text="previewQuoteExcerpt(quote)"></span>
                              </div>
                            </div>
                          </template>
                        </div>
                      </template>
                      <template x-if="(m.images && m.images.length) || (m.docs && m.docs.length)">
                        <div class="user-msg-imgs">
                          <template x-for="(im, ii) in (m.images || [])" :key="'i'+ii">
                            <!-- Single root element required by x-for.
                                 imgSrc(): blob URL (live) → base64 thumb (reload) → placeholder.
                                 IMPORTANT: render the <img> ONLY when we have a real source.
                                 With :src="" the browser resolves it to the current page URL
                                 and triggers a real network request that fails (was firing
                                 [muse-capture] resource-load-failed errors in console). -->
                            <span class="user-msg-img-wrap">
                              <template x-if="messageImageSrc(im)">
                                <!-- in-bubble thumbnail prefers preview (live blob URL,
                                     freshest) > thumb (base64 thumbnail in JSONL); only
                                     falls back to full url if neither is available.
                                     Lightbox click PREFERS url (full-res original
                                     served from disk) > preview > thumb — that's the
                                     fix for "click to enlarge shows blurry upscale". -->
                                <img class="user-msg-img"
                                     :src="messageImageSrc(im)"
                                     :alt="im.name || 'image'"
                                     @click="openMessageImage(im)"
                                     :title="lang==='zh'?'点击放大':'Click to enlarge'"
                                     @error="$el.style.display='none'; $el.nextElementSibling && ($el.nextElementSibling.style.display='inline-flex')" />
                              </template>
                              <span class="user-msg-img-placeholder"
                                    :style="messageImageSrc(im) ? 'display:none' : 'display:inline-flex'"
                                    :title="im.mime || 'image'">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                              </span>
                            </span>
                          </template>
                          <template x-for="(doc, di) in (m.docs || [])" :key="'d'+di">
                            <span class="user-msg-doc" :title="doc.name">
                              <svg><use href="#i-file-text"/></svg>
                              <span x-text="doc.name"></span>
                            </span>
                          </template>
                        </div>
                      </template>
                      <template x-if="m._editing">
                        <div class="edit-msg-wrap">
                          <textarea class="edit-msg-ta"
                                    x-model="m._editText"
                                    x-init="$el.style.height='auto'; $el.style.height=$el.scrollHeight+'px'; $nextTick(() => { $el.focus(); const l=$el.value.length; $el.setSelectionRange(l,l); })"
                                    @input="$el.style.height='auto'; $el.style.height=$el.scrollHeight+'px'"
                                    @keydown.ctrl.enter.prevent="commitEditMessage(m)"
                                    @keydown.meta.enter.prevent="commitEditMessage(m)"
                                    @keydown.escape.prevent="cancelEditMessage(m)"></textarea>
                          <div class="edit-msg-footer">
                            <button class="btn-ghost xs" @click.stop="cancelEditMessage(m)" x-text="t('btn.cancel')"></button>
                            <button class="btn-primary xs" @click.stop="commitEditMessage(m)" x-text="t('btn.send')"></button>
                          </div>
                        </div>
                      </template>
                      <template x-if="!m._editing">
                        <span class="user-msg-text" x-show="userVisibleText(m)"
                              x-html="userTextHtml(userVisibleText(m))"></span>
                      </template>
                    </div>
                  </div>
                  <div class="msg-actions">
                    <button @click="copyMsg(m)" class="icon-btn sm"
                            :class="{ 'copied-flash': m._copied }"
                            :title="m._copied ? (lang==='zh'?'已复制':'Copied') : (lang==='zh'?'复制':'Copy')">
                      <svg x-show="!m._copied"><use href="#i-copy"/></svg>
                      <svg x-show="m._copied"><use href="#i-check"/></svg>
                    </button>
                    <button @click="memorySaveMessage(m)" class="icon-btn sm"
                            :class="{ 'copied-flash': m._memorySaved }"
                            :title="lang==='zh' ? '明确保存为记忆' : 'Save as confirmed memory'">
                      <svg><use :href="m._memorySaved ? '#i-check' : '#i-brain'"/></svg>
                    </button>
                    <button x-show="pane && !pane.streaming && !m._editing"
                            @click="startEditMessage(m)" class="icon-btn sm"
                            :title="t('btn.edit')">
                      <svg><use href="#i-edit"/></svg>
                    </button>
                    <button x-show="m._failed"
                            @click="retryFailedMessage(m)" class="icon-btn sm retry-btn"
                            :title="lang==='zh' ? '重试发送' : 'Retry'">
                      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>
                      </svg>
                    </button>
                  </div>
                </div>
                <!-- Failed-message error card with classified CTA — only shows
                     when the backend sent kind/cta classification (modern
                     backend). Old-backend failures still get the bare ↻
                     button above. -->
                <template x-if="m._failed && m._error_cta && m._error_cta !== 'retry'">
                  <div class="err-card"
                       :class="'err-kind-' + (m._error_kind || 'unknown')">
                    <div class="err-card-body">
                      <div class="err-card-msg" x-text="m._error_text || ''"></div>
                      <div class="err-card-actions">
                        <button class="btn-primary xs"
                                @click="errorCtaInvoke(m)"
                                x-text="errorCtaLabel(m._error_kind, m._error_cta)"></button>
                        <button x-show="m._error_retryable"
                                class="btn-ghost xs"
                                @click="retryFailedMessage(m)"
                                x-text="lang==='zh' ? '直接重试' : 'Retry as-is'"></button>
                      </div>
                    </div>
                  </div>
                </template>
              </template>

              <!-- assistant text bubble — has avatar; subsequent
                   non-user msgs in the same run hide theirs via CSS. -->
              <template x-if="m.role === 'assistant' && !m._is_compact_summary">
                <div class="asst-msg-wrap">
                  <div class="msg-row">
                    <span class="msg-avatar assistant-avatar"
                          :class="{ 'is-streaming-avatar': isStreamingTurnAvatar(i, paneMsgs, pane && pane.streaming) }"
                          :title="mascotLabel()">
                      <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
                    </span>
                    <div class="bubble"
                         :class="{ 'is-streaming-bubble': pane && pane.streaming && i === paneMsgs.length - 1 }"
                         x-init="observeAssistantBody($el, m, tid)">
                      <div x-show="m._streamPlain" class="stream-plain" x-text="m._streamText || ''"></div>
                      <!-- Newly-virtualized history must never be blank while its
                           rich renderer catches up. Show resident text immediately
                           (the transport preview until body prefetch completes), then
                           upgrade automatically to sanitized Markdown/attachments. -->
                      <div x-show="!m._streamPlain && !m.html"
                           class="history-plain"
                           x-text="m.text || m.preview || ''"></div>
                      <div x-show="!m._streamPlain && m.html" x-html="m.html || ''"></div>
                    </div>
                  </div>
                  <!-- Per-bubble footer removed. Time + streaming dots
                       are rendered once per turn in the turn-footer
                       at the end of the row's root div (see below) so
                       a turn made up of thinking + tool_use + tool_
                       result + assistant gets ONE timestamp at the
                       bottom, not three. -->
                  <!-- msg-actions-assistant: the assistant copy bar stays
                       visible on touch devices (no hover, no bubble-tap
                       fallback like user msgs get) — see styles.css. -->
                  <div class="msg-actions msg-actions-assistant">
                    <button @click="copyMsg(m)" class="icon-btn sm"
                            :class="{ 'copied-flash': m._copied }"
                            :title="m._copied ? (lang==='zh'?'已复制':'Copied') : (lang==='zh'?'复制':'Copy')">
                      <svg x-show="!m._copied"><use href="#i-copy"/></svg>
                      <svg x-show="m._copied"><use href="#i-check"/></svg>
                    </button>
                    <button @click="memorySaveMessage(m)" class="icon-btn sm"
                            :class="{ 'copied-flash': m._memorySaved }"
                            :title="lang==='zh' ? '明确保存为记忆' : 'Save as confirmed memory'">
                      <svg><use :href="m._memorySaved ? '#i-check' : '#i-brain'"/></svg>
                    </button>
                  </div>
                </div>
              </template>

              <!-- thinking — wrap in msg-row + spacer avatar so the
                   CSS-hidden avatar still occupies the same 32px gutter
                   and the block lines up with assistant text blocks. -->
              <template x-if="m.role === 'thinking'">
                <div class="msg-row">
                  <span class="msg-avatar assistant-avatar"
                        :class="{ 'is-streaming-avatar': isStreamingTurnAvatar(i, paneMsgs, pane && pane.streaming) }"
                        :title="mascotLabel()">
                    <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
                  </span>
                  <div :class="thinkingClass(i, m, pane, paneMsgs)">
                    <div class="thinking-head"
                         @click.stop="toggleMsgExpanded(m, i)"
                         :title="lang==='zh' ? '点击展开/折叠' : 'Click to expand / collapse'">
                      <span class="thinking-chevron">
                        <svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2">
                          <path :d="isMsgExpanded(i, m, false, pane, paneMsgs) ? 'M4 6l4 4 4-4' : 'M6 4l4 4-4 4'"/>
                        </svg>
                      </span>
                      <span class="icon"><svg><use href="#i-brain"/></svg></span>
                      <span class="thinking-label-text">thinking</span>
                      <span x-show="!isMsgExpanded(i, m, false, pane, paneMsgs)" class="thinking-preview" x-text="thinkingPreview(m)"></span>
                    </div>
                    <pre x-show="isMsgExpanded(i, m, false, pane, paneMsgs)" x-text="m.text"></pre>
                  </div>
                </div>
              </template>

              <!-- TodoWrite -->
              <template x-if="m.role === 'tool_use' && m.name === 'TodoWrite'">
                <div class="msg-row">
                  <span class="msg-avatar assistant-avatar"
                        :class="{ 'is-streaming-avatar': isStreamingTurnAvatar(i, paneMsgs, pane && pane.streaming) }"
                        :title="mascotLabel()">
                    <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
                  </span>
                  <div class="todo-card">
                    <div class="todo-card-head">
                      <span class="todo-card-icon"><svg><use href="#i-check-circle"/></svg></span>
                      <span class="todo-card-title" x-text="t('todo.title')"></span>
                      <span class="todo-card-count"
                            x-text="(m.todos || []).filter(td => td.status==='completed').length + ' / ' + (m.todos || []).length"></span>
                    </div>
                    <ul class="todo-list">
                      <template x-for="(td, tdi) in (m.todos || [])" :key="tdi">
                        <li :class="'todo-item todo-' + (td.status || 'pending')">
                          <span class="todo-status">
                            <svg x-show="td.status==='completed'"><use href="#i-check"/></svg>
                            <span x-show="td.status==='in_progress'" class="todo-spinner"></span>
                            <span x-show="td.status!=='completed' && td.status!=='in_progress'" class="todo-dot"></span>
                          </span>
                          <span class="todo-text" x-text="td.content || td.subject || td.description || ''"></span>
                          <span x-show="td.status==='in_progress'" class="todo-tag" x-text="t('todo.doing')"></span>
                        </li>
                      </template>
                    </ul>
                  </div>
                </div>
              </template>

              <!-- Task subagent ("Agent" is the SDK's current tool name, "Task" the legacy one) -->
              <template x-if="m.role === 'tool_use' && (m.name === 'Task' || m.name === 'Agent')">
                <div class="msg-row">
                  <span class="msg-avatar assistant-avatar"
                        :class="{ 'is-streaming-avatar': isStreamingTurnAvatar(i, paneMsgs, pane && pane.streaming) }"
                        :title="mascotLabel()">
                    <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
                  </span>
                  <div class="subagent-card">
                    <div class="subagent-head">
                      <span class="subagent-icon"><svg><use href="#i-tool"/></svg></span>
                      <span class="subagent-label" x-text="t('subagent.label')"></span>
                      <span class="subagent-type" x-text="(m.task && m.task.subagent_type) || 'agent'"></span>
                    </div>
                    <div class="subagent-desc" x-text="(m.task && m.task.description) || ''"></div>
                    <details class="subagent-prompt" x-show="m.task && m.task.prompt">
                      <summary x-text="t('subagent.prompt_toggle')"></summary>
                      <pre x-text="m.task && m.task.prompt"></pre>
                    </details>
                    <!-- SDK-native background-task status (run_in_background=
                         true). The task_started/progress/notification SSE
                         handlers stamp m.task_status via tool_use_id. Renders
                         ⏳ running → ✅/❌, with the SDK summary + an open-result
                         link (best-effort openByPathToasted on output_file). -->
                    <template x-if="m.task_status">
                      <div class="subagent-task"
                           :class="'is-' + (m.task_status.state || 'running')">
                        <span class="subagent-task-badge"
                              x-text="taskStatusLabel(m.task_status.state)"></span>
                        <span class="subagent-task-summary"
                              x-show="m.task_status.summary"
                              x-text="m.task_status.summary"></span>
                        <a class="subagent-task-open" href="#"
                           x-show="m.task_status.output_file"
                           @click.prevent="openTaskOutput(m.task_status)"
                           x-text="t('subagent.open_result')"></a>
                        <!-- Stop button — only while running. Backed by the
                             SDK-native stop_task control request; the card
                             flips to ⏹ when the CLI's status='stopped'
                             notification round-trips the settle path. -->
                        <a class="subagent-task-stop" href="#"
                           x-show="(m.task_status.state || 'running') === 'running' && m.task_status.task_id"
                           @click.prevent="stopBackgroundTask(m.task_status)"
                           x-text="'⏹ ' + t('subagent.stop_task')"></a>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- ExitPlanMode -->
              <template x-if="m.role === 'tool_use' && m.name === 'ExitPlanMode' && !m._approvalSuperseded">
                <div class="msg-row">
                  <span class="msg-avatar assistant-avatar"
                        :class="{ 'is-streaming-avatar': isStreamingTurnAvatar(i, paneMsgs, pane && pane.streaming) }"
                        :title="mascotLabel()">
                    <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
                  </span>
                  <div class="plan-card">
                    <div class="plan-head">
                      <span class="plan-icon"><svg><use href="#i-check-circle"/></svg></span>
                      <span class="plan-title" x-text="t('plan.title')"></span>
                    </div>
                    <div class="plan-body markdown-body" x-html="renderMd(m.plan || '')"></div>
                  </div>
                </div>
              </template>

              <!-- Task* family (TaskCreate / TaskUpdate / TaskStop) —
                   collapsed to single log line. Pure queries (TaskList /
                   TaskGet / TaskOutput) are hidden entirely. Adjacent task
                   lines visually fuse into a "plan panel" via CSS sibling
                   selectors (see .task-log-line + .task-log-line). -->
              <template x-if="m.role === 'tool_use' && isTaskTool(m) && shouldRenderTaskLine(m)">
                <div class="task-log-line" :class="taskLogLine(m)?.colorClass">
                  <span class="task-log-icon" x-text="taskLogLine(m)?.icon"></span>
                  <span class="task-log-verb" x-text="taskLogLine(m)?.verb"></span>
                  <span class="task-log-ref" x-show="taskLogLine(m)?.ref"
                        x-text="taskLogLine(m)?.ref"></span>
                  <span class="task-log-subject" x-show="taskLogLine(m)?.subject"
                        x-text="taskLogLine(m)?.subject"></span>
                </div>
              </template>

              <!-- default tool bubble -->
              <template x-if="m.role === 'tool_use' && m.name !== 'TodoWrite' && m.name !== 'Task' && m.name !== 'Agent' && m.name !== 'ExitPlanMode' && !isTaskTool(m) && !conciseHidesToolUse(m)">
                <div class="msg-row">
                  <span class="msg-avatar assistant-avatar"
                        :class="{ 'is-streaming-avatar': isStreamingTurnAvatar(i, paneMsgs, pane && pane.streaming) }"
                        :title="mascotLabel()">
                    <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
                  </span>
                  <div class="tool"
                       :class="{ 'tool-mcp': m.name && m.name.startsWith('mcp__'), 'tool-skill': m.name === 'Skill' }">
                    <!-- MCP enhanced: emoji per known server + server · tool layout -->
                    <template x-if="m.name && m.name.startsWith('mcp__') && mcpServerInfo(m.name)">
                      <span class="tool-name">
                        <span class="tool-prefix-icon mcp-emoji"
                              x-text="mcpServerInfo(m.name).icon"></span>
                        <span class="mcp-server-label"
                              x-text="mcpServerInfo(m.name).serverLabel"></span>
                        <span class="mcp-sep">·</span>
                        <span class="mcp-tool-label"
                              x-text="mcpServerInfo(m.name).toolLabel"></span>
                      </span>
                    </template>
                    <!-- Non-MCP: original simple label -->
                    <template x-if="!(m.name && m.name.startsWith('mcp__'))">
                      <span class="tool-name">
                        <span x-show="m.name === 'Skill'" class="tool-prefix-icon"><svg><use href="#i-puzzle"/></svg></span>
                        <span x-text="renderToolName(m.name)"></span>
                      </span>
                    </template>
                    <template x-if="toolFilePath(m)">
                      <a class="tool-arg file-link" href="#"
                         :data-path="toolFilePath(m)"
                         :title="toolFilePath(m)"
                         x-text="toolFilePath(m)"></a>
                    </template>
                    <!-- MCP input preview: compact key:val · key:val list -->
                    <template x-if="!toolFilePath(m) && m.name && m.name.startsWith('mcp__') && mcpInputPreview(m)">
                      <span class="tool-arg mcp-input-preview" x-text="mcpInputPreview(m)"></span>
                    </template>
                    <template x-if="!toolFilePath(m) && !(m.name && m.name.startsWith('mcp__'))">
                      <span class="tool-arg" x-text="m.summary"></span>
                    </template>
                    <!-- SDK-native background-task status for non-subagent
                         tools (Bash run_in_background=true). Same task_status
                         contract as the subagent card: task_started/progress/
                         notification SSE handlers stamp m.task_status via
                         tool_use_id; renders ⏳ running → ✅/❌ + summary +
                         open-result link. Without this, a background Bash card
                         never flips (only the Task/Agent template had it). -->
                    <template x-if="m.task_status">
                      <span class="tool-task"
                            :class="'is-' + (m.task_status.state || 'running')">
                        <span class="tool-task-badge"
                              x-text="taskStatusLabel(m.task_status.state)"></span>
                        <span class="tool-task-summary"
                              x-show="m.task_status.summary"
                              x-text="m.task_status.summary"></span>
                        <a class="tool-task-open" href="#"
                           x-show="m.task_status.output_file"
                           @click.prevent="openTaskOutput(m.task_status)"
                           x-text="t('subagent.open_result')"></a>
                        <!-- Stop button — same contract as the subagent
                             card's: visible only while running, settles via
                             the CLI's status='stopped' notification. -->
                        <a class="tool-task-stop" href="#"
                           x-show="(m.task_status.state || 'running') === 'running' && m.task_status.task_id"
                           @click.prevent="stopBackgroundTask(m.task_status)"
                           x-text="'⏹ ' + t('subagent.stop_task')"></a>
                      </span>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Diff strip under Edit / MultiEdit / Write — code-review
                   style with red/green row backgrounds, default expanded
                   so users see the actual change immediately. Header is
                   still clickable to collapse for users who want a
                   scannable stream.
                   IMPORTANT: this template is a SIBLING of the "default tool
                   bubble" template above (not a child) because Alpine
                   <template x-if> only renders its first root element —
                   nesting two roots in one x-if silently drops the second.
                   The role guard here recovers what the parent x-if used to
                   filter for. -->
              <!-- The diff strip is a SECOND x-if on the same tool_use message,
                   so it needs its own concise gate — the generic bubble's gate
                   above does not cover it. -->
              <template x-if="m.role === 'tool_use' && ['Edit','MultiEdit','Write'].includes(m.name) && m.input && (m.input.old_string || m.input.new_string || m.input.edits || m.input.content) && !conciseHidesToolUse(m)">
                <div class="diff-strip diff-strip-cr"
                     :class="{ 'is-collapsed': !isMsgExpanded(i, m, isLatestEditTool(i, m, paneMsgs, tid), pane, paneMsgs) }">
                  <div class="diff-strip-head" @click.stop="toggleMsgExpanded(m, i)">
                    <span class="thinking-chevron">
                      <svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2">
                        <path :d="isMsgExpanded(i, m, isLatestEditTool(i, m, paneMsgs, tid), pane, paneMsgs) ? 'M4 6l4 4 4-4' : 'M6 4l4 4-4 4'"/>
                      </svg>
                    </span>
                    <span class="diff-strip-label" x-text="lang==='zh' ? '改动预览' : 'diff'"></span>
                    <template x-if="editDiffStats(m)">
                      <span class="diff-strip-stats">
                        <span x-show="(editDiffStats(m)?.plus ?? 0) > 0"
                              class="diff-strip-plus" x-text="'+' + (editDiffStats(m)?.plus ?? 0)"></span>
                        <span x-show="(editDiffStats(m)?.minus ?? 0) > 0"
                              class="diff-strip-minus" x-text="'−' + (editDiffStats(m)?.minus ?? 0)"></span>
                      </span>
                    </template>
                  </div>
                  <div x-show="isMsgExpanded(i, m, isLatestEditTool(i, m, paneMsgs, tid), pane, paneMsgs)" class="diff-body diff-body-cr">
                    <template x-for="(op, oi) in editDiffOps(m)" :key="oi">
                      <div :class="'diff-line diff-' + op.op">
                        <span class="diff-sign" x-text="op.op === 'ins' ? '+' : op.op === 'del' ? '−' : op.op === 'sep' ? '⋯' : ' '"></span>
                        <span class="diff-text" x-text="op.text"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- tool_result — suppressed for:
                   - Task*       (log line above already shows state change)
                   - Edit / Write / MultiEdit on success (diff strip shows
                     the change; "File has been updated successfully" is
                     pure noise to the user).
                   Failures (is_error) always render so the user sees
                   what broke + the errorFixHint banner. -->
              <template x-if="m.role === 'tool_result' && !shouldHideToolResult(m)">
                <div class="msg-row">
                  <span class="msg-avatar assistant-avatar"
                        :class="{ 'is-streaming-avatar': isStreamingTurnAvatar(i, paneMsgs, pane && pane.streaming) }"
                        :title="mascotLabel()">
                    <svg viewBox="0 0 24 24"><use :href="mascotHref()"/></svg>
                  </span>
                  <div :class="toolResultClass(i, m, pane, paneMsgs)">
                    <div class="tool-result-head"
                         @click.stop="toggleMsgExpanded(m, i)"
                         :title="lang==='zh' ? '点击展开/折叠' : 'Click to expand / collapse'">
                      <span class="thinking-chevron">
                        <svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2">
                          <path :d="isMsgExpanded(i, m, false, pane, paneMsgs) ? 'M4 6l4 4 4-4' : 'M6 4l4 4-4 4'"/>
                        </svg>
                      </span>
                      <span x-show="!isMsgExpanded(i, m, false, pane, paneMsgs)" class="tool-result-summary"
                            x-text="toolResultSummary(m, i, paneMsgs)"></span>
                    </div>
                    <!-- Error hint banner — shown for failed tool calls when
                         we can detect a common pattern + give a fix. Only
                         visible when the user explicitly expands the result;
                         collapsed state should stay quiet. -->
                    <template x-if="m.is_error && errorFixHint(m) && isMsgExpanded(i, m, false, pane, paneMsgs)">
                      <div class="tool-error-hint">
                        <span class="tool-error-hint-icon">💡</span>
                        <span class="tool-error-hint-text" x-text="errorFixHint(m)"></span>
                      </div>
                    </template>
                    <!-- expanded body: per-tool renderer takes precedence,
                         falls back to plain text for unknown tool types -->
                    <template x-if="isMsgExpanded(i, m, false, pane, paneMsgs)">
                      <div class="tool-result-body">
                        <!-- Bash: terminal-style w/ stdout / stderr split -->
                        <template x-if="toolResultKind(m) === 'bash'">
                          <div class="bash-term">
                            <template x-if="bashResultText(m).stdout">
                              <pre class="bash-stdout" x-text="bashResultText(m).stdout"></pre>
                            </template>
                            <template x-if="bashResultText(m).stderr">
                              <pre class="bash-stderr" x-text="bashResultText(m).stderr"></pre>
                            </template>
                            <template x-if="bashResultText(m).interrupted">
                              <div class="bash-meta interrupted">
                                <svg class="bash-meta-icon"><use href="#i-alert-triangle"/></svg>
                                <span x-text="lang==='zh' ? '被打断' : 'interrupted'"></span>
                              </div>
                            </template>
                            <template x-if="typeof bashResultText(m).exit_code === 'number'">
                              <div class="bash-meta" :class="{ ok: bashResultText(m).exit_code === 0, err: bashResultText(m).exit_code !== 0 }"
                                   x-text="(lang==='zh' ? '退出码 ' : 'exit ') + bashResultText(m).exit_code"></div>
                            </template>
                          </div>
                        </template>
                        <!-- Read: line-numbered gutter -->
                        <template x-if="toolResultKind(m) === 'read'">
                          <div class="read-gutter">
                            <template x-for="(row, ri) in readResultLines(m)" :key="ri">
                              <div class="read-row">
                                <span class="read-lineno" x-text="row.n || ''"></span>
                                <span class="read-code" x-text="row.content"></span>
                              </div>
                            </template>
                          </div>
                        </template>
                        <!-- WebFetch / WebSearch: card w/ source badge on top -->
                        <template x-if="toolResultKind(m) === 'web'">
                          <div class="web-card">
                            <template x-if="findToolUseFor(m, i, paneMsgs) && webSourceUrl(findToolUseFor(m, i, paneMsgs))">
                              <div class="web-source">
                                <span class="web-source-icon"
                                      x-text="webIsUrl(webSourceUrl(findToolUseFor(m, i, paneMsgs))) ? '🔗' : '🔍'"></span>
                                <template x-if="webIsUrl(webSourceUrl(findToolUseFor(m, i, paneMsgs)))">
                                  <a class="web-source-link"
                                     :href="webSourceUrl(findToolUseFor(m, i, paneMsgs))"
                                     target="_blank" rel="noopener"
                                     x-text="webSourceDomain(webSourceUrl(findToolUseFor(m, i, paneMsgs)))"></a>
                                </template>
                                <template x-if="!webIsUrl(webSourceUrl(findToolUseFor(m, i, paneMsgs)))">
                                  <span class="web-source-query"
                                        x-text="webSourceUrl(findToolUseFor(m, i, paneMsgs))"></span>
                                </template>
                              </div>
                            </template>
                            <div class="web-card-body" x-html="toolResultMd(m)"></div>
                          </div>
                        </template>
                        <!-- Glob / Grep: parsed hits with clickable file paths -->
                        <template x-if="toolResultKind(m) === 'search'">
                          <div class="search-hits-list">
                            <template x-for="(hit, hi) in searchHitsFor(m).slice(0, 100)" :key="hi">
                              <div class="search-hit">
                                <template x-if="hit.path">
                                  <a class="search-hit-path file-link" href="#"
                                     :data-path="hit.path"
                                     :title="hit.path"
                                     x-text="hit.path"></a>
                                </template>
                                <template x-if="hit.lineno !== null">
                                  <span class="search-hit-lineno" x-text="':' + hit.lineno"></span>
                                </template>
                                <template x-if="hit.content">
                                  <span class="search-hit-content" x-text="hit.content"></span>
                                </template>
                                <template x-if="!hit.path && !hit.content">
                                  <span class="search-hit-raw" x-text="hit.raw"></span>
                                </template>
                              </div>
                            </template>
                            <template x-if="searchHitsFor(m).length > 100">
                              <div class="search-hit-truncated"
